# Diagnostic lane only. Keep this out of the walk-up timing verdict until its
# instrumentation overhead has been measured against an uninstrumented control.
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_TIMING_FUNCTIONS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y

# Deliberately absent: CONFIG_THREAD_ANALYZER_AUTO. Its worker and stack are too
# expensive for this image and perturb the lane it is meant to observe.
