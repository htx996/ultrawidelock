# nRF5340-only Thread settings, layered on overlay-thread.conf by
# mk/satellite.mk when SAT_BOARD names that board. Split out for stage E
# (docs/second-anchor.md): the satellite now also builds for the DWM3001CDK,
# and both lines below describe a two-core part, so on the CDK's single-core
# nRF52833 they configure a radio peer that does not exist.
#
# This file is the app-core half. The net-core image itself is the other half,
# selected by sysbuild-thread.conf, and the two are passed together or not at
# all -- a serialisation host with no controller behind it comes up cleanly and
# then never sees a frame, which is the failure that reads as a dead radio.
#
# The nRF5340's 802.15.4 radio lives on the NETWORK core, unlike the
# DWM3001CDK's nRF52833 where it is on-core. The app core reaches it through
# the serialisation host.
CONFIG_NRF_802154_SER_HOST=y
