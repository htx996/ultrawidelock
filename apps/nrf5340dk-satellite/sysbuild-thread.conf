# Net-core image for the Thread satellite build. Paired with
# overlay-thread.conf and selected together by `make sat-build SAT_THREAD=1`.
#
# The nRF5340 is two cores: the app core runs this application, and the radio
# is on the network core, which needs its own firmware or the 802.15.4 host
# comes up and never sees a frame. ipc_radio is nRF Connect SDK's controller
# image and these two symbols select the 802.15.4 variant of it
# (nrf/sysbuild/Kconfig.netcore).
#
# IEEE802154, not BT_HCI_IPC: examples/zephyr/nrf5340dk-initiator picks the
# BT-only variant because that app speaks BLE. This one speaks Thread and has no
# BLE duty at all, so the controller is the 802.15.4 one and the flash figures
# from the initiator do not transfer.
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_IEEE802154=y
