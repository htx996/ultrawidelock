# BENCH ONLY. Relaxes the inside-latch clear choreography to what a desk
# bench can physically produce.
#
# CLEAR_MIN_MM: the witnesses only report the phone's label inside ~2 m
# (it must make the 8-tuple cut), so a clear-run that must START beyond
# the 3 m default can never start here. 1.5 m keeps the far-start rule
# while placing it inside the reportable zone.
#
# ENTRY_DWELL_MS: 60 s between trials makes bench iteration miserable;
# 15 s still proves the dwell fires.
#
# Never on a mounted door: the 3 m start is what makes an inside phone's
# multipath unable to fake an approach, and the 60 s dwell is the
# tailgating guard.
CONFIG_ULTRAWIDELOCK_LATCH_CLEAR_MIN_MM=1500
CONFIG_ULTRAWIDELOCK_LATCH_ENTRY_DWELL_MS=15000
