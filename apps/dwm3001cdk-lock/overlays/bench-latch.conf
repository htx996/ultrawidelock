# BENCH ONLY. Relaxes the inside-latch clear choreography to what a desk
# bench can physically produce.
#
# CLEAR_MIN_MM: on an open desk both witnesses hear the phone about
# equally beyond ~2 m (measured 2026-08-21: rssi_io -70/-73 at 2.5 m),
# so OUTSIDE only becomes decidable around 1.2-2 m and the temporal
# filter commits it another couple of windows later -- a run that must
# START beyond 1.5 m never starts. 0.8 m keeps a far-start rule that
# this geometry can actually satisfy. (1.5 m was tried first and the
# side=2 commit always landed just inside it.)
#
# ENTRY_DWELL_MS: 60 s between trials makes bench iteration miserable;
# 15 s still proves the dwell fires.
#
# Never on a mounted door: the 3 m start is what makes an inside phone's
# multipath unable to fake an approach, and the 60 s dwell is the
# tailgating guard.
CONFIG_ULTRAWIDELOCK_LATCH_CLEAR_MIN_MM=800
CONFIG_ULTRAWIDELOCK_LATCH_ENTRY_DWELL_MS=15000
