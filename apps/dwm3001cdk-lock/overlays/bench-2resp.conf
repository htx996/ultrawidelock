# Stage-B bench (docs/second-anchor.md): the lock advertises a 2-responder
# round — the phone reserves slot 3 for the satellite's Response_1 and moves
# its Final out one slot — and prints the SAT-HANDOFF line (which carries the
# session URSK) at every credential start, for pasting into the satellite's
# `sat join`. Both knobs bake into the SaltedHash: a lock on this overlay only
# ranges against a phone session it opened itself, and only pairs with a
# satellite built with the same responder count.
#
# Bench only, like every file in this directory: never on a mounted door.
# Build: make build CDK_CONF="overlay-thread.conf;overlays/bench-2resp.conf;overlay-lto.conf"
CONFIG_ULTRAWIDELOCK_NUM_RESPONDERS=2
CONFIG_ULTRAWIDELOCK_SATELLITE_HANDOFF_LOG=y
