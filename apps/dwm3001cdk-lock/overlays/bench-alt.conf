# Block-parity alternation, lock half: this anchor answers EVEN ranging blocks,
# the satellite (examples/zephyr/satellite, parity 1) answers the odd ones. Both
# share one session's keys and one responder slot, which is the only arrangement
# the phone reports (it never consumed a second responder record; see
# docs/second-anchor.md, stage B).
#
# Does NOT stack on bench-2resp.conf: that one sets NUM_RESPONDERS=2, and
# alternation needs the 1-responder round the phone actually grants on.
# The handoff log is what feeds `sat join` on the satellite; it prints the
# session URSK, so this is a bench image only, never a mounted door.
#
# Costs the lock half its sample rate: trust at K=3 takes about 1152 ms instead
# of 576 ms worst case, so expect walk-up grants roughly half a second later.
# Build: make build CDK_CONF="overlay-thread.conf;overlays/bench-alt.conf;overlay-lto.conf"
CONFIG_ULTRAWIDELOCK_BLOCK_PARITY=0
CONFIG_ULTRAWIDELOCK_SATELLITE_HANDOFF_LOG=y
