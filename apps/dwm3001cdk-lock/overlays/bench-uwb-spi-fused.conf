# Fuse the four contiguous STS key/IV word writes into one 16-byte SPI burst.
# Pair with one of dw3110-spi-{8,16,32}.overlay and compare the zero-log SPI
# phase counters plus IRQ-to-arm latency. Never ship before on-air STS proof.
CONFIG_DW3000_SPI_METRICS=y
CONFIG_DW3000_STS_BULK_WRITE_EXPERIMENT=y
