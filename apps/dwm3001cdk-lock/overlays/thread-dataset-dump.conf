# BENCH ONLY. Prints the Thread network key to the log whenever the
# commissioning window opens (SW2), not on every attach.
#
# Append to CDK_CONF for the one job that needs it -- commissioning a second
# Matter administrator over BLE, whose chip-tool command takes a dataset
# argument and where the only safe dataset is the one the node already runs:
#
#   make build SMP=1 RELEASE=1 \
#     CDK_CONF="overlay-thread.conf;overlay-release.conf;overlay-smp.conf;overlay-lto.conf;overlays/thread-dataset-dump.conf"
#
# overlay-lto.conf MUST be in that list. CDK_LTO defaults to 1 (mk/cdk.mk:148),
# so overriding CDK_CONF without it silently drops LTO -- measured at 40,008 B
# of flash, which reads as though this file cost 40 KB and takes the image from
# 87.73% to 96.96%. Copy the whole default list and append, never retype it.
#
# Never in a shipping image. There is no runtime gate: a build either discloses
# the key when a window opens or cannot.
CONFIG_ULTRAWIDELOCK_THREAD_DATASET_DUMP=y
