# The channel classifier in the unlock path: ultrawidelock_ml decides LOS/NLOS per ranging
# block and ultrawidelock_approach widens its unlock radius while a body is in the way.
#
# NOT THE CAPTURE IMAGE, and the difference is which reception the diagnostics
# come from. overlays/cirdiag.conf takes one reception in eight and does not care
# which, because a training set only needs a few hundred per class. A classifier
# needs one call per approach sample, and there is exactly one approach sample per
# ranging block, so this image latches on the Final and nothing else.
#
# NOT A SHIPPING IMAGE EITHER, until a walk-up says otherwise. See the two
# unproven claims at the bottom.

CONFIG_ULTRAWIDELOCK_UWB_CIRDIAG=y
CONFIG_ULTRAWIDELOCK_ML_LOS=y

# One latch per ranging block, on the reception with the whole ~192 ms gap behind
# it. Without this the classifier sees one reception in eight and its
# majority-of-three vote over a five-sample window can never be reached.
CONFIG_ULTRAWIDELOCK_UWB_CIRDIAG_SUMMARY_FINAL_ONLY=y

# Only the fields the feature set uses: drops three SPI reads per latch and the
# LOG_MAX double-buffer copy set. Everything ultrawidelock_ml_los_features() consumes
# survives.
CONFIG_ULTRAWIDELOCK_UWB_CIRDIAG_SUMMARY_LEAN=y

# The decimator is inert under FINAL_ONLY (the deadline check runs first) and is
# set to 1 so the two cannot multiply into one latch in eight blocks if that
# ordering is ever changed.
CONFIG_ULTRAWIDELOCK_UWB_CIRDIAG_SUMMARY_EVERY=1

# The [ALAB] lines are printk from uwb_cirdiag.c and are not log-gated, so this
# only affects everything else. INF keeps a walk-up legible without flooding the
# 8 KB RTT buffer.
CONFIG_LOG_DEFAULT_LEVEL=3

# ONE PROVEN CLAIM AND ONE OPEN ONE.
#
# 1. THE READ FITS -- PROVEN on a 2026-08-07 walk-up, second attempt. One latch
#    per ranging block for 471 blocks, ranges 0-505 cm, six unlock/relock
#    cycles, rdcyc ~62,232 DWT cycles = 972 us inside the ~192 ms gap (worst
#    79,541 ~= 1.24 ms). The FIRST walk that day printed ZERO [ALAB] lines with
#    clean ranging -- the outcome the old criteria said could not happen --
#    because nothing armed the summary stream and the gate keyed on
#    deadline_pending, which the summary path sets true even on the Final.
#    Both fixed: main.c arms the stream at boot, the gate keys on is_final.
#    A regression re-runs the criteria: tx0 = the read is back on a deadline;
#    clean ranging with no [ALAB] lines = the latch is not running at all.
#
# 2. THAT THE WIDENING HELPS. ultrawidelock_approach's cfg.nlos_widen_cm is 0 by default
#    and nothing here sets it, so this image classifies, logs, and changes no
#    decision. That is deliberate: RESULTS.md Result 21 measured the obstruction
#    offset at +82 cm with one body and +127 cm with another, so the number is an
#    install's to choose after watching its own door. Run this image first and
#    read the classifier against what you were actually doing; set the widening
#    second. What to read: one "[ALAB] ev=ml n=.. cm=.. cls=.. conf_c=.. dis=..
#    carry=.. carry_t=.." line per ranging block (cls 1 = obstructed; conf_c is
#    the confidence in centi-units against the 261 vote gate; dis = tree
#    disagrees with the vendor >6 dB rule), and "[ALAB] ev=ml.vote blocked=.."
#    on every flip of the debounced 3-of-5 verdict -- the exact state a widened
#    build would consume.
#
# 3. THAT CARRY MODE IS SEPARABLE AT ALL. carry is the BodyCal class
#    (0 clear, 1 in-hand, 2 pocket, 3 bag) and carry_t says whether a four-class
#    model produced it. THE SHIPPED TREE IS TWO-CLASS, so on this image carry_t
#    is always 0 and carry only ever reads 0 or 1 -- pocket and bag are
#    unreachable, and cfg.nlos_widen_class_cm[] entries for them are dead.
#    Splitting them needs a retrained tree, which needs a capture this repo does
#    not hold: docs/bodycal-falsification.md is the protocol, and its pass
#    condition is per-class residual std <= ~15 cm. A fail there means the
#    per-class table stays at 0 and the single nlos_widen_cm is all that ships.
