# THIS DESK'S CALIBRATION for the two-anchor bench. Layers on top of
# ../overlay-anchorlink.conf, which is the actual feature; this file is nothing
# but numbers measured in one room and switches that weaken what a walk-up
# proves. Never flash it on a mounted door.
#
# Build:
#   make build LATCH=1 CDK_BUILD=build/cdk-anchorlink-bench \
#     CDK_CONF="overlay-thread.conf;overlay-latch.conf;overlays/bench-2resp.conf;\
#               overlay-anchorlink.conf;overlays/bench-anchorlink.conf;overlay-lto.conf"
# or `make anchorlink BENCH=1`.

# Tape-measured on the current bench, antenna centre to antenna centre.
# Without this the Kconfig default (1200) silently mis-sizes every triangle
# check. Re-measure whenever a board moves.
CONFIG_ULTRAWIDELOCK_ANCHOR_BASELINE_MM=1400

# This board read 840 mm at a tape-measured 1000 (phone held at the second
# anchor's antenna, 31 samples). The satellite measured ~0 bias the same way,
# so only this side is corrected. Recalibrate if the DW3110 or its antenna
# changes.
CONFIG_ULTRAWIDELOCK_UWB_RANGE_BIAS_MM=160

# BENCH ONLY, and it weakens what a walk-up proves. The shipping 3000 exists so
# a clear always begins where the two anchors are nowhere near equidistant. On
# this 1400 mm baseline that range is the collinear degenerate zone instead:
# |d_inside - d_outside| approaches the baseline, and the triangle gate rejects
# the pair, so the latch can never see a first agreeing window and refuses for
# ever on ULTRAWIDELOCK_LATCH_R_WINDOWS. 1200 sits inside the well-conditioned
# region for this separation. Raise the anchors apart and put this back before
# reading any result here as evidence about a real door.
CONFIG_ULTRAWIDELOCK_LATCH_CLEAR_MIN_MM=800
# 800, not the 1200 first tried here: with the frontier biased to the lock
# board, 800 on the offset walk is still ~9 sigma outside the boundary, and
# the 2026-08-21 walks showed the real cost of a higher floor -- every body-
# shadow INSIDE near the lock reset the clear run, and a run that can only
# restart beyond 1200 turned each reset into a full extra walk-up.

# BENCH ONLY. The shipping 60 s says "an unlock means somebody entered; do not
# passively unlock again for a minute". Iterating on a bench means crossing the
# plane and retrying within seconds, and every retry inside the dwell is burned
# before the evidence is even read. 1 s keeps the rule barely observable while
# staying out of rapid cycling's way. Put 60000 back on a mounted door.
CONFIG_ULTRAWIDELOCK_LATCH_ENTRY_DWELL_MS=1000

# BENCH ONLY. Both anchors stand on the same side of the walkway here, so the
# bisector splits the walkway itself and half of every approach reads INSIDE.
# This pushes the frontier to 200 mm in front of the CDK on the axis
# ((1400 - 1000) / 2); on the 40-50 cm offset walk the hyperbola bends the
# flip to almost exactly abeam the CDK. "Inside" now means "past the lock
# board", which is what a desk can actually test. 400 mm short of the
# degenerate limit, ~4 sigma of the 92 mm difference jitter. Delete this
# line the day the anchors straddle a real door.
CONFIG_ULTRAWIDELOCK_ANCHOR_BOUNDARY_BIAS_MM=1000

# Runtime recalibration: type `BL <mm>` or `BL cal` into the make monitor-rtt
# terminal. Persisted; overrides ANCHOR_BASELINE_MM above until re-set, and
# moves the frontier bias with it (see baseline_bias() in main.c).
CONFIG_ULTRAWIDELOCK_SIDE_FEED_RTT=y

# BENCH ONLY. The Wallet UWB toggle (or a reflash) opens a 20 s window where a
# clean OUTSIDE unlocks with no approach -- toggling asks the geometry directly.
# Never on a mounted door: iOS recreates sessions on its own schedule too.
CONFIG_ULTRAWIDELOCK_BENCH=y
CONFIG_ULTRAWIDELOCK_BENCH_TOGGLE_UNLOCK=y
# BENCH=y would drag the latency trace in by default; the slot has ~2 kB left.
CONFIG_ULTRAWIDELOCK_LAT_TRACE=n
