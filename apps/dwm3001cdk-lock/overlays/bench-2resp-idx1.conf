# Slot-3 probe (stacks on bench-2resp.conf): the LOCK answers as responder 1,
# slot 2 stays empty. The phone provably accepts this radio, so its Final_Data
# is a clean binary on whether it listens in slot 3 at all — the discriminator
# for stage B's acceptance question when a real satellite Response_1 goes
# unreported. While this is flashed the lock's own DS-TWR only works if the
# phone reports slot 3, so walk-up grants may not fire. Bench only; revert to
# bench-2resp.conf after the probe.
# Build: make build CDK_CONF="overlay-thread.conf;overlays/bench-2resp.conf;overlays/bench-2resp-idx1.conf;overlay-lto.conf"
CONFIG_ULTRAWIDELOCK_RESPONDER_INDEX=1
