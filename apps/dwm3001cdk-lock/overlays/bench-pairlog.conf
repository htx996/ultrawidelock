# Cross-anchor comparison instrument. Stacks on bench-2resp.conf.
#
# Makes the lock print one "pair blk=N mm=X" line per accepted trusted range,
# so its capture can be joined on block against the satellite's and the two
# distances subtracted at the same instant.
#
# THE QUESTION IT ANSWERS. Put the phone on the perpendicular bisector of the
# two anchors and the true difference is zero by construction, so whatever the
# subtraction yields is entirely error. If it clusters tightly around a
# constant, the error is a fixed differential bias: measure it once, subtract
# it, and the side verdict works. If it wanders by hundreds of millimetres, no
# amount of code makes sign(d_inside - d_outside) mean anything, because the
# dead band is 60 mm.
#
# Nothing measured so far can tell those two cases apart -- every reading came
# from ONE anchor, and a common-mode shift that cancels exactly in the
# difference looks identical to a differential one when you only have one side.
#
# Build: make build CDK_CONF="overlay-thread.conf;overlays/bench-2resp.conf;overlays/bench-pairlog.conf;overlay-lto.conf"
CONFIG_ULTRAWIDELOCK_ANCHOR_PAIR_LOG=y
