# BENCH ONLY. Drops the OUTSIDE margin to 2 dB for trials where both
# witnesses sit in open air with no door between them -- there the 6 dB
# default is rarely reachable and every window lands in the dead band.
#
# Never on a mounted door: 2 dB is within ordinary multipath swing, so a
# phone INSIDE can read OUTSIDE for long enough to clear agree_windows.
# The default margin is the inside-safety guarantee; this overlay trades
# it away to let bench walk-ups commit a side at all.
CONFIG_ULTRAWIDELOCK_SIDE_OUTSIDE_MARGIN_DB=2
