# The lock on a battery. Layers on top of overlay-thread.conf.
#
#   make build BATTERY=1 RELEASE=1 SMP=1
#
# WHY THIS IS AN OVERLAY AND NOT THE DEFAULT. Every lever in here buys current
# by spending latency, and the base configuration spent measured effort buying
# that latency back. A mains-powered board should not pay for a battery it does
# not have, so the default is unchanged and a battery build opts in.
#
# THE BUDGET THIS IS WRITTEN AGAINST. 5,000 mAh nameplate, six months. That is
# 4,380 hours, so 1.14 mA with no margin at all. Derate for usable-to-cutoff
# (~85%), six months of Li-ion self-discharge (~15%) and cold, and the honest
# design target is about 3,500 mAh of real energy and 800 uA average.
#
# WHAT THIS OVERLAY CANNOT DO, AND IT IS THE LARGEST TERM. On a DWM3001CDK the
# on-board J-Link OB debugger draws on the order of 10-20 mA on its own, which
# is 12 to 25 TIMES the entire budget above, from a part whose only job is
# debugging. Add four LEDs and the dev-kit regulator and a stock CDK is 20-50x
# over before a single line of this firmware runs. No Kconfig can reach that.
#
# So: this overlay is necessary and nowhere near sufficient. It is worth roughly
# 2x. Getting off the dev kit is worth roughly 100x. See docs/power-baseline.md.

# ---- Thread: sleepy, not rx-on ---------------------------------------------
#
# THIS IS NO LONGER A LATENCY PREFERENCE, IT IS ARITHMETIC. The 802.15.4
# receiver at 100% duty is ~4.6-6.5 mA (MEASURED as a duty cycle: RADIO.STATE
# read 3 on 20 of 20 samples, docs/power-baseline.md §1). At 5 mA alone, 3,500
# mAh is gone in 29 days. Six months is unreachable with rx-on-when-idle, full
# stop, whatever else is optimised.
#
# 500 ms, NOT the 3000 that was tried and reverted. overlay-thread.conf:53
# records why: at POLL_PERIOD=3000 a hub-to-node message waited a mean 1,500 ms
# and the advertised SII paced every peer retransmit at 3.3 s or more. At 500 ms
# the mean wait is 250 ms, which is a different product. The estimated cost of
# the polling itself is ~25-35 uA, so the extra ten polls a second are nearly
# free -- the 3000 was never buying much power, it was just spending latency.
#
# THE THREE DECLARATIONS ALREADY AGREE AT 500, which is the part that usually
# goes wrong. This node states its availability in three places and they lie if
# they diverge:
#   1. the radio                ← this file, below
#   2. the SRP TXT record       ports/zephyr/matter/matter_thread_port.c:414  SII="500"
#   3. the Sigma2 session params modules/ultrawidelock_matter/src/matter_case.c:832  500
# (2) and (3) were already set to 500 when the node moved to MED, so this line
# makes the radio match what it has been advertising all along. Change the poll
# period without them and peers pace their retries against a fiction.
#
# WHAT THIS DOES NOT SLOW: the walk-up unlock. That path is BLE advertisement,
# connect, credential auth, then UWB ranging, and Thread is in none of it. What
# does get ~250 ms slower is Home-app tile taps, Siri, status refresh, and
# commissioning's post-BLE tail.
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_POLL_PERIOD=500

# ---- BLE: two-rate advertising ---------------------------------------------
#
# The second-largest firmware term, and it was hiding. Continuous 30-60 ms
# connectable advertising costs an estimated 220-670 uA -- most of the 800 uA
# budget, spent on being findable at a door nobody is standing at. At the
# GAP-recommended slow pair (1.0-1.2 s) the same estimate is 10-30 uA.
#
# A flat slow interval would be wrong, which is why this is a window and not a
# constant: it would regress walk-up detection, Matter commissioning discovery
# and the Web Bluetooth chooser all at once. Instead the board advertises fast
# after boot and after every disconnect, then falls back.
#
# THE HONEST COST. A phone approaching a lock that has been idle for hours meets
# the slow rate, so first discovery takes ~1-3 s instead of well under 1 s. The
# fix for that is a wake trigger rather than a faster default -- the LIS2DH12 on
# the module is already driven by ports/zephyr/drivers/ultrawidelock_slam_lis2dh12.c
# at 10 Hz for ~2 uA, and handle-touch is a real signal. That is not wired here.
CONFIG_ULTRAWIDELOCK_BLE_ADV_SLOW=y
CONFIG_ULTRAWIDELOCK_BLE_ADV_FAST_WINDOW_S=30

# ---- LEDs, and there are TWO sets on this board ------------------------------
#
# An LED at 2-5 mA is several times the whole budget.
#
# The nRF52833's four (D9 green, D12 red, D11 red, D10 blue on P0.04/14/22/05).
# status_led.c already stops its tick on an all-static frame, so a dark idle
# board costs nothing, but a pattern left solid does not go away on its own.
CONFIG_ULTRAWIDELOCK_STATUS_LED=n

# The DW3110's own, which are a DIFFERENT CHIP and survive the line above. This
# was found the honest way: with STATUS_LED=n a red LED was still lit, and the
# nRF was demonstrably not driving it -- all four LED pins read PIN_CNF=0x02,
# the reset default, and P0.DIR had none of them as outputs.
#
# dwt_setleds(DWT_LEDS_ENABLE) points the radio's GPIO2/GPIO3 at its internal
# RXLED/TXLED, and to do it sets CLK_CTRL_GPIO_DCLK_EN and CLK_CTRL_LP_CLK_EN --
# a de-bounce clock and the low-power oscillator, running inside a part this
# overlay otherwise works hard to keep at 260 nA.
CONFIG_ULTRAWIDELOCK_UWB_LEDS=n
