# OpenThread's own logging, for diagnosing what the mesh refuses to do.
#
#   make build OTLOG=1 CDK_BUILD=build/cdk-otlog
#
# NEVER SHIP THIS. It is here because OpenThread's log level is 0 in every other
# configuration, and 0 is not a choice this tree made: the level Kconfig sits
# behind `depends on OPENTHREAD_DEBUG` (zephyr/modules/openthread/Kconfig:66-68),
# so with debug off the symbol falls through every default and lands on 0. The
# stack is silent by construction, and no amount of CONFIG_LOG_DEFAULT_LEVEL
# changes that.
#
# WHAT IT BOUGHT, on the first run. Not what this file originally predicted: it
# expected to catch the SRP server's verdict on a registration the application
# could only see as one undifferentiated otError. There was no verdict, because
# there was no registration. MEASURED 2026-08-03, three minutes attached:
#
#   [I] SrpClient-----: HostInfo Removed -> ToAdd
#   [I] SrpClient-----: Service Removed -> ToAdd, "..." "_matter._tcp"   (x2)
#
# and then nothing for the rest of the log. No "Rejected", and -- the line that
# actually answers it -- no "SrpClientInfo {Server:[...]}" at all, so the client
# never chose a server to send to. Both services sat at ToAdd forever while the
# node was a healthy attached child: OMR address configured, Matter subscriptions
# restored over the reboot, and a walk-up credential unlock completing end to end.
#
# The boot-time "NO off-mesh-routable address" warning is NOT that failure. It
# fires 9 ms after Thread start with the role still detached, and the same run
# later carries Matter traffic on the border router's prefix.
#
# So the question moved, and CONFIG_ULTRAWIDELOCK_SRP_DIAG below is where it moved to:
# whether auto-start is ever offered a server at all. The OpenThread lines are
# still what makes that readable -- they are the proof network data arrived.
#
# LOG_MODE_MINIMAL HAS TO GO, and that is a link error rather than a choice.
# otPlatLog (zephyr/modules/openthread/platform/logging.c:38) forwards through
# log_generic(), the runtime vararg API, and minimal mode does not implement it:
#
#   otPlatLog.constprop.0: undefined reference to `z_log_msg_runtime_vcreate'
#
# So OpenThread's logging and CONFIG_LOG_MODE_MINIMAL cannot both be on. That is
# the real reason this stack has been silent, not the level alone.
#
# CONFIG_LOG_DEFAULT_LEVEL MUST STAY AT 3. logging.c registers no log module of
# its own, so these lines arrive under the default module and the default level
# filters them. Turning the app's own logging down to save room takes the very
# lines this overlay exists to print.
#
# COSTS FLASH, AND IT FITS -- barely. MEASURED 2026-08-03 against the 433,664 B
# app partition: 423,636 B, 97.69%, 10,028 B free, everything in this file
# included. The 409,988 B default and 13,648 B delta were measured on that
# 2026-08-03 tree; the current production image is 397,360 B without OTLOG.
# Re-measure this diagnostic overlay before using its old headroom. It exists to answer
# one question, which is the other reason this never ships. An overflow fails
# the link, which is the right failure -- nothing ships and nothing is flashed.
#
# DO NOT SET CONFIG_OPENTHREAD_PLATFORM_LOG_LEVEL. otPlatLog gates on it
# (logging.c:46) so it looks like the knob, but Kconfig:100 declares it as an
# int with no prompt, derived from the level choice below -- INFO gives it 3 on
# its own. Assigning it aborts the CMake configure rather than warning.
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_OPENTHREAD_DEBUG=y
CONFIG_OPENTHREAD_LOG_LEVEL_INFO=y

# ROOM FOR THE ABOVE. The first build that linked overflowed FLASH by 1,120 B,
# so three modules give up their INF and WRN strings. None of them can touch the
# question this overlay asks: the SRP client is inside OpenThread and reaches
# the console through otPlatLog, not through any of these.
#
# The app's own errors survive -- LOG_ERR is still compiled in, which is the
# level "SRP registration FAILED" is logged at. What is lost is the INF
# narration around it ("Thread attached", "reachable"), and OpenThread's own
# logging is more than dense enough to place events in time without it.
#
# Every symbol here was read out of a generated .config first. A module log
# level that does not exist is not a warning, it aborts the CMake configure --
# the same way CONFIG_OPENTHREAD_PLATFORM_LOG_LEVEL did above.
CONFIG_BT_LOG_LEVEL_ERR=y
CONFIG_ULTRAWIDELOCK_DFU_LOG_LEVEL_ERR=y
CONFIG_ULTRAWIDELOCK_CRED_LOG_LEVEL_ERR=y

# THE QUESTION THIS OVERLAY NOW ASKS. The first run with OpenThread's logging on
# showed no server rejection at all -- no rejection, and no server. See
# CONFIG_ULTRAWIDELOCK_SRP_DIAG in apps/dwm3001cdk-lock/Kconfig for what it prints and why network
# data changing is the only moment worth printing it. Lives here rather than in
# a second overlay because it is unreadable without the OpenThread lines around
# it: they are what proves network data arrived at all.
#
# matter_thread is deliberately NOT trimmed above, so its INF and WRN survive.
CONFIG_ULTRAWIDELOCK_SRP_DIAG=y
