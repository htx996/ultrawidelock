# Inside veto: the lock refuses passive unlock for a phone it believes is indoors.
#
#   make build LATCH=1 CDK_BUILD=build/cdk-latch
#   make cdk-size CDK_SIZE_REPORTS=0 CDK_BUILD=build/cdk-latch
#
# Layers on top of the side gate rather than replacing it: the side filter
# still classifies each window, and the latch decides what a run of those
# classifications is allowed to authorise. Read docs/inside-latch.md first.
#
# Use LATCH=1 rather than hand-editing CDK_CONF (same trap as SIDE=1 and
# ANCHOR=1: dropping overlay-lto.conf costs ~41 KB).

CONFIG_ULTRAWIDELOCK_ANCHOR=y
CONFIG_ULTRAWIDELOCK_SIDE_GATE=y
CONFIG_ULTRAWIDELOCK_INSIDE_LATCH=y

# The deployed evidence path. Unlike overlay-side.conf this needs no debug
# probe and no host: the witnesses report over the Thread network the lock is
# already joined to.
CONFIG_ULTRAWIDELOCK_WITNESS_LINK_OT=y

# Deliberately NOT set, and the difference from overlay-side.conf is the point:
#
#   CONFIG_ULTRAWIDELOCK_SIDE_FEED_RTT   needs a J-Link held for the session
#   CONFIG_ULTRAWIDELOCK_SIDE_PEER_EMIT  logs the phone's private address
#
# The second one is not merely unshipped, it is unnecessary now. It existed so
# bench tooling could push the credential's address to the witnesses as a
# filter. The witnesses no longer filter by address and the lock no longer
# matches one: it picks the phone out of the room by correlating advertiser
# RSSI against its own authenticated UWB range (ultrawidelock_witness_pick.h).
# Nothing in this configuration knows or stores a phone identifier.

# Settings carries the latch records across reboots. Already y for Matter
# fabric storage in the Thread build; restated because the latch depends on it
# for a safety property, not for convenience.
CONFIG_SETTINGS=y

CONFIG_ULTRAWIDELOCK_LATCH_ENTRY_DWELL_MS=60000
CONFIG_ULTRAWIDELOCK_LATCH_CLEAR_WINDOWS=3
CONFIG_ULTRAWIDELOCK_LATCH_CLEAR_MIN_MM=3000
CONFIG_ULTRAWIDELOCK_LATCH_CLEAR_VALID_MS=10000
CONFIG_ULTRAWIDELOCK_WITNESS_NONCE_MS=30000
