# The Matter CLIENT role: this lock opens ANOTHER Matter lock when the UWB gate
# fires. See docs/matter-binding.md.
#
# Additive. The node stays a full Door Lock server and everything it already
# does is unchanged; what this adds is the other direction. Off, not one byte of
# it is compiled, which is why it is an overlay rather than a default.
#
# MEASURED cost of the OpenThread DNS client this pulls in, on the
# thread+release+smp+lto image: 4,052 B of flash, 160 B of RAM. The client's own
# code is on top of that. Order it after overlay-release.conf so nothing it sets
# can be undone.
CONFIG_ULTRAWIDELOCK_MATTER_CLIENT=y
