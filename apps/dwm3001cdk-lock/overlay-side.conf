# Fail-closed INSIDE/OUTSIDE/THRESHOLD gate for passive approach unlock.
#
#   make build SIDE=1 CDK_BUILD=build/cdk-side
#
# Requires commissioned BLE witnesses feeding the lock. Without them, every
# passive unlock is withheld (fail-closed). NFC Express Mode and Apple Home
# commands are unchanged.
#
# Use SIDE=1 rather than rewriting CDK_CONF by hand (same trap as ANCHOR=1:
# dropping overlay-lto.conf costs ~41 KB).

CONFIG_ULTRAWIDELOCK_ANCHOR=y
CONFIG_ULTRAWIDELOCK_SIDE_GATE=y

# Bench-only, both default n. The RTT feed needs a debug probe holding the
# connection, and the peer emit logs the phone's resolvable private address so
# the witnesses can filter on it. Neither belongs in a shipped image.
CONFIG_ULTRAWIDELOCK_SIDE_FEED_RTT=y
CONFIG_ULTRAWIDELOCK_SIDE_PEER_EMIT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=512

CONFIG_ULTRAWIDELOCK_ANCHOR_BASELINE_MM=1400
CONFIG_ULTRAWIDELOCK_ANCHOR_TOL_MM=90
CONFIG_ULTRAWIDELOCK_ANCHOR_DEADBAND_MM=60
CONFIG_ULTRAWIDELOCK_ANCHOR_STALE_MS=1500
CONFIG_ULTRAWIDELOCK_ANCHOR_SELF_INSIDE=y
