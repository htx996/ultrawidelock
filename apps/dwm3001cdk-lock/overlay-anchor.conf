# Two-anchor geometry on the door node.
#
#   make build ANCHOR=1 CDK_BUILD=build/cdk-anchor
#
# Use ANCHOR=1 and not a hand-written CDK_CONF. CDK_CONF is the WHOLE overlay
# list, so setting it by hand drops whatever you forgot to repeat -- and the one
# most easily forgotten is overlay-lto.conf, which is worth about 41 KB of
# flash. It fails as a 39 KB regression attributed to whatever you were
# measuring, with no warning anywhere. Measured here the first time round.
#
# NOT in the default build, and that is the point: the shipping image stays
# byte-identical until someone decides to pay for this. Every symbol below is
# default n.
#
# What it buys: the second anchor's verdict gates UNLOCK_PREDICT (and only
# PREDICT), plus an impact/tamper interrupt from the accelerometer that is
# already linked into the image and currently does nothing.
#
# What it costs: measure it. `make cdk-size-check CDK_BUILD=build/cdk-anchor`
# against a build without this file is the only number worth quoting, because
# the CDK Matter image is the one where a new static allocation is a decision
# rather than a detail.
#
# Nothing feeds the satellite verdict yet -- Stage C owns the transport -- and
# that is a working state: with no report the verdict is UNKNOWN, UNKNOWN
# permits prediction, and the door behaves exactly as it does today.

CONFIG_ULTRAWIDELOCK_ANCHOR=y
CONFIG_ULTRAWIDELOCK_ANCHOR_SLAM=y

# The baseline is measured: 1400 mm centre-to-centre on the current bench.
# Re-measure whenever a board moves. The rest are still placeholders: the
# tolerance and dead band come from the ranging jitter stage A actually
# measures, not from the target it aims at; and the impact threshold has to
# come from a capture of this door being closed and slammed.
CONFIG_ULTRAWIDELOCK_ANCHOR_BASELINE_MM=1400
CONFIG_ULTRAWIDELOCK_ANCHOR_TOL_MM=90
CONFIG_ULTRAWIDELOCK_ANCHOR_DEADBAND_MM=60
CONFIG_ULTRAWIDELOCK_ANCHOR_STALE_MS=1500
CONFIG_ULTRAWIDELOCK_ANCHOR_SELF_INSIDE=y
CONFIG_ULTRAWIDELOCK_ANCHOR_SLAM_THRESHOLD_MG=2000
