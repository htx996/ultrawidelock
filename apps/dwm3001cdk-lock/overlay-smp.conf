# SMP over Bluetooth, so a phone can push an update with off-the-shelf tooling.
#
#   make build SMP=1 RELEASE=1 && make flash                  # what ships
#   make build SMP=1 && make flash                            # debug
#
# WHAT THIS BUYS. nRF Device Manager and nRF Connect for iOS speak mcumgr and
# nothing else. With this overlay the board answers them, and an update needs no
# Mac, no Python and no cable: Images -> Upload the .wdfu patch, then Device ->
# Reset. The native L2CAP channel (src/dfu_ble_zephyr.c) stays exactly as it
# was, so `make dfu` is unaffected and either route works.
#
# RELEASE=1 USED TO BE EFFECTIVELY REQUIRED. It is not any more, and the reason
# is worth reading before you reach for it out of habit.
#
# What this file said, measured at the time and correct then:
#
#     debug   + SMP    128,660 B of 131,072   98.16%     2,412 B free
#     release + SMP    121,492 B of 131,072   92.69%     9,580 B free
#
# 2,412 B is not enough to absorb a connection event on a board also running
# Thread, Matter and UWB, so RELEASE=1 was the only way to fit -- and since its
# cost is the 8 KB RTT ring, that made SMP the configuration you could not debug
# over SWD. "Keep a debug build to hand before flashing it" was the workaround.
#
# MEASURED 2026-08-04, after standalone OpenThread retired the Zephyr IP layer
# (see overlay-thread.conf) and errors-only logging landed in
# overlay-release.conf, before the five-fabric multi-admin work:
#
#     debug   + SMP    118,308 B of 131,072   90.26%    12,764 B free
#     release + SMP    111,012 B of 131,072   84.70%    20,060 B free
#
# The current 2026-08-16 release+SMP image is 120,740 B (92.12%), leaving
# 10,332 B after five-fabric, response-replay, and durable transaction state.
# Re-measure debug+SMP before relying on the historical 12,764 B margin above.
# Debug remains the profile to reach for during commissioning because
# RELEASE=1's log level 1 cannot narrate a stall.
#
# RELEASE=1 is still what ships. It is no longer what makes this fit.
#
# WHAT IS NOT ENABLED, and cannot be. Zephyr's own image group:
#
#     CONFIG_MCUMGR_GRP_IMG ... was assigned the value 'y' but got 'n'.
#     Check these unsatisfied dependencies:
#         IMG_MANAGER (=n), (!MCUBOOT_BOOTLOADER_MODE_SINGLE_APP) (=n)
#
# img_mgmt is gated off by single-slot mode ITSELF, not by a missing partition,
# so no renaming of patch_staging reaches it. Single-slot mode is what makes
# MCUboot fit in a 512 KB part. ports/zephyr/dfu/dfu_smp_img.c therefore
# serves group 1 directly, forwarding every byte into the same receiver, the
# same signature check and the same window gate as the native transport.

CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y

# THE SECURITY COST OF THIS LINE, stated plainly. The permission choice defaults
# to _RW_AUTHEN whenever BT_SMP is on, which demands a paired link -- and this
# reader must never ask a phone to pair, because pairing is not how a credential
# credential authorises anything. _RW removes the prompt and leaves the SMP
# endpoint writable by any unpaired peer in radio range.
#
# What stands in front of it is the update window, and only that: uploads and
# erases are refused with ACCESS_DENIED until the owner presses SW2 or Apple
# Home opens a commissioning window. Behind it, the patch is signed and MCUboot
# re-verifies the result, so no peer can install code either way.
#
# If you do not need phone tooling, leave this overlay off. The native L2CAP
# channel gates on the same window and needs no world-writable endpoint.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y

# Big enough that a 400+ B upload chunk arrives in one buffer, small enough that
# two of them are 1 KB. Count 2 is the minimum that lets a response be built
# while the next request is being reassembled.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=2
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=2048

# Group 1, ours. Group 0 for the reset that starts the bootloader applying.
CONFIG_ULTRAWIDELOCK_DFU_SMP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# THE RESET GATE, and it is load-bearing. Group 0 command 5 reboots the board,
# and with _RW above it is reachable by any unpaired peer in radio range -- a
# reboot loop on a door lock, needing no credential and no pairing. The hook
# lets dfu_smp_img.c refuse a reset unless the owner opened an update window or
# a verified patch is already staged. Turning either symbol off silently
# reopens that hole, because the handler simply stops being called.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y

# Everything else off. Each of these is an endpoint an unpaired peer could
# reach, and none is needed to move a patch: taskstat and info leak the
# firmware's internals, and fs/settings/shell would expose the reader identity
# and the Matter fabrics that live in settings_storage.
CONFIG_MCUMGR_GRP_OS_TASKSTAT=n
CONFIG_MCUMGR_GRP_OS_INFO=n
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=n
CONFIG_MCUMGR_GRP_SHELL=n
CONFIG_MCUMGR_GRP_STAT=n
CONFIG_MCUMGR_GRP_FS=n
CONFIG_MCUMGR_GRP_SETTINGS=n
