# UltraWideLock sysbuild overlay, DFU variant. Pass via -DSB_EXTRA_CONF_FILE=<...>/sysbuild-dfu.conf
# INSTEAD OF sysbuild-ultrawidelock.conf, never beside it: the two disagree on every symbol
# here, and which one wins would then depend on list order. `make nrf-build DFU=1`
# selects this one; the default build still selects the other.
#
# This is the upstream configuration, restated rather than inherited by leaving
# the symbols unset. Upstream's Kconfig.sysbuild already defaults BOOTLOADER_MCUBOOT
# and nrf/sysbuild/Kconfig.matter already defaults MATTER_OTA to y, so an empty file
# would build the same image today. Naming them means a future upstream bump that
# changes a default shows up as a diff here instead of silently changing what
# `DFU=1` means.

# The bootloader the no-bootloader build gives up. Costs 33,280 B of app-core
# flash (mcuboot 0x8000 + mcuboot_pad 0x200) and is what makes the image
# updatable in the field at all. The secondary slot is NOT part of that cost: it
# lands on the DK's MX25R64 external QSPI, so dual-slot is free of internal flash
# here. That is the whole reason this variant is cheap on this board and was not
# on the DWM3001CDK, which has no external flash and needed a delta scheme
# (modules/ultrawidelock_dfu) instead.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE is deliberately NOT here, and it is the one
# symbol in this file that must not be. Sysbuild hands it to the bootloader image
# through set_config_string() rather than through a .conf, and a value written
# here would be resolved relative to the MCUboot repository and land back on the
# published demo key without saying so. scripts/nrf5340dk-build.sh passes it as
# an absolute -D instead, after scripts/check-signing-key.sh has vetted it, and
# reads it back out of the built mcuboot .config afterwards.

# Matter OTA Requestor. nrf/sysbuild/CMakeLists.txt:831-835 force-writes
# CONFIG_CHIP_OTA_REQUESTOR into the app image from THIS symbol, bypassing app
# Kconfig, so sysbuild is the only effective place to set it either way. It also
# gates generation of the matter.ota image (same file, line 1015), which is the
# artefact an OTA Provider serves.
SB_CONFIG_MATTER_OTA=y

# Deliberately NOT set here, and left to upstream's own defaults for this SoC
# (applications/matter-aliro-door-lock-app/Kconfig.sysbuild, the SOC_SERIES_NRF53
# block): MCUBOOT_MODE_OVERWRITE_ONLY, BOOT_SIGNATURE_TYPE_ECDSA_P256,
# SECURE_BOOT_NETCORE, NETCORE_APP_UPDATE, MCUBOOT_NRF53_MULTI_IMAGE_UPDATE and
# the DFU_MULTI_IMAGE_PACKAGE_{APP,NET} pair. Those describe how this SoC updates
# its two cores; nothing in this port has an opinion about them.
#
# Also deliberately absent: the `uwb_qm35_dfu` snippet and its
# pm_static_..._uwb_dfu.yml. That map exists to field-update a QM35 UWB
# coprocessor's firmware over the same DFU channel. This port drives a bare
# DW3110/DW3720 on the app core's SPI bus with no coprocessor to update, so the
# plain pm_static_nrf5340dk_nrf5340_cpuapp.yml is the correct map and the build
# picks it up on its own once apps/nrf5340dk-lock/overlays/pm_static.yml stops being
# passed (nrf/cmake/partition_manager.cmake:36-64).
