# UltraWideLock Home-Assistant overlay — layered after ultrawidelock-cred.conf by HA=1 ./build.sh
#
# Opt-in only. Everything here is deliberately kept out of the default build so
# the Apple Home + Wallet demo image is unaffected. HA=1 also turns on
# CONFIG_ULTRAWIDELOCK_HA, which is what selects the matching data model
# (integrations/nrfconnect-door-lock/app/src/matter/zap_uwb_ha) and compiles the
# proximity callback that writes its occupancy endpoint. That used to be a pair
# of patches into the fetched workspace, applied in one order and no other.

# --- Lock operation credentials --------------------------------------------
# Attach the credential that opened the lock to the LockState update, so a Matter
# admin (e.g. Home Assistant) sees which credential acted, not just the new state.
# The call site is already written for it (app_task.cpp guards the credential
# list on this symbol), and the credential path fills the result in
# ValidateAliroCredential() with kAliroNonEvictableEndpointKey /
# kAliroEvictableEndpointKey, so this covers tap and approach, not only PIN.
#
# Upstream deliberately defaults it off: "This option should stay disabled until
# TC-DRLK-2.3 is fixed", connectedhomeip issue 38222 (add-on src/matter/Kconfig).
# That is a certification-test failure rather than a known functional break, but
# it is why this lives here and not in ultrawidelock-cred.conf.
CONFIG_LOCK_PASS_CREDENTIALS_TO_SET_LOCK_STATE=y

# --- Data model ------------------------------------------------------------
# The Door Lock LockOperation event and the UWB-proximity Occupancy Sensing
# endpoint. Set here rather than passed as a -D flag so that one file says what
# HA=1 means, and so a build configured straight from these overlays gets the
# data model that the rest of this file assumes.
CONFIG_ULTRAWIDELOCK_HA=y
