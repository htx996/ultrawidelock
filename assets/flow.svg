<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-label="Sequence: an iPhone or Apple Watch presents a Wallet home key over BLE, both ends run AUTH0, AUTH1 and EXCHANGE to derive the URSK, the key ladder seeds an STS session for DS-TWR ranging, a trusted range gates the unlock, and lock state is reported to Apple Home over Thread.">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1820"/>
      <stop offset="1" stop-color="#070f15"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12262b"/>
      <stop offset="1" stop-color="#0a181c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63e0f0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0f7c8f" stop-opacity="0.35"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto">
      <path d="M0,0.6 L8.5,4.5 L0,8.4 Z" fill="#2fd0e6"/>
    </marker>
    <marker id="al" markerWidth="9" markerHeight="9" refX="0.5" refY="4.5" orient="auto">
      <path d="M8.5,0.6 L0,4.5 L8.5,8.4 Z" fill="#2fd0e6"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="449" rx="16" fill="url(#panel)" stroke="#1a323c"/>

  <g font-family="DejaVu Sans,Verdana,Geneva,sans-serif">

    <g font-size="11" font-weight="bold" fill="#7f9aa6" letter-spacing="1.4" text-anchor="middle">
      <text x="210" y="38">IPHONE / APPLE WATCH</text>
      <text x="610" y="38">ULTRAWIDELOCK</text>
    </g>

    <rect x="110" y="50" width="200" height="48" rx="10" fill="url(#chip)" stroke="url(#edge)" stroke-width="1.5"/>
    <text x="210" y="80" font-size="14" fill="#e6f7fb" text-anchor="middle">Wallet home key</text>

    <rect x="510" y="50" width="200" height="48" rx="10" fill="url(#chip)" stroke="url(#edge)" stroke-width="1.5"/>
    <text x="610" y="80" font-size="13" fill="#e6f7fb" text-anchor="middle"
          font-family="DejaVu Sans Mono,SFMono-Regular,Menlo,monospace">nRF52833 + DW3110</text>

    <g stroke="#1e3a44" stroke-width="1.5" stroke-dasharray="3 5">
      <path d="M210 98 V372"/>
      <path d="M610 98 V398"/>
    </g>

    <g font-size="13" fill="#9db6c0">
      <g fill="#2fd0e6" font-weight="bold">
        <text x="26" y="158">1</text>
        <text x="26" y="212">2</text>
        <text x="26" y="284">3</text>
        <text x="26" y="346">4</text>
        <text x="26" y="403">5</text>
      </g>
      <text x="48" y="158">BLE</text>
      <text x="48" y="212">Auth</text>
      <text x="48" y="284">UWB</text>
      <text x="48" y="346">Gate</text>
      <text x="48" y="403">Matter</text>
    </g>

    <g font-size="13" fill="#dff6fa" text-anchor="middle"
       font-family="DejaVu Sans Mono,SFMono-Regular,Menlo,monospace">
      <text x="410" y="142">credential service 0xFFF2</text>
      <text x="410" y="196">AUTH0 &#8594; AUTH1 &#8594; EXCHANGE</text>
      <text x="410" y="268">key ladder &#8594; STS &#8594; DS-TWR</text>
      <text x="410" y="314">range trusted: 3 blocks agree</text>
    </g>

    <g stroke="#2fd0e6" stroke-width="1.6" fill="none">
      <path d="M214 154 H602" marker-end="url(#ar)"/>
      <path d="M218 208 H602" marker-start="url(#al)" marker-end="url(#ar)"/>
      <path d="M218 280 H602" marker-start="url(#al)" marker-end="url(#ar)"/>
      <path d="M614 398 H642" marker-end="url(#ar)"/>
    </g>

    <text x="410" y="230" font-size="11.5" fill="#7f9aa6" text-anchor="middle" font-style="italic">both ends derive the URSK</text>

    <rect x="330" y="330" width="160" height="32" rx="16" fill="#0d2a24" stroke="#3ee0a0" stroke-width="1.5"/>
    <text x="410" y="351" font-size="13" font-weight="bold" fill="#3ee0a0" letter-spacing="2.6" text-anchor="middle">UNLOCK</text>

    <text x="568" y="403" font-size="13" fill="#dff6fa" text-anchor="end"
          font-family="DejaVu Sans Mono,SFMono-Regular,Menlo,monospace">lock state over Thread</text>

    <rect x="646" y="376" width="184" height="44" rx="10" fill="url(#chip)" stroke="url(#edge)" stroke-width="1.5"/>
    <text x="738" y="404" font-size="14" fill="#e6f7fb" text-anchor="middle">Apple Home</text>

  </g>
</svg>
