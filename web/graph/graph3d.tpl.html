<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subsystem graph — UltraWideLock</title>
<meta name="description" content="Every source file in UltraWideLock as a force-directed graph, grouped by subsystem. Useful for finding the seam between the UWB facade and a port.">
<script>(function(){try{var t=localStorage.getItem('uwl-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script>document.documentElement.className+=' js';</script>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="../assets/design/fonts/jetbrains-mono.woff2">
<link rel="stylesheet" href="../assets/design/styles.css">
<style>
/* The chrome follows the design system; only what it does not define is set
   here. The stage keeps an opaque near-black of its own on purpose: the halo
   shells blend against it and the dust sheets are drawn over it. */
:root{
  /* --stage stays dark in both themes on purpose (see above). --barbg must
     not: the bar's text is --strong/--muted/--faint, which flip with the
     theme, so a fixed dark bar left the breadcrumb at 1.04:1 on light. Deriving
     it from --surface with the same recipe .topbar uses keeps the frosted look
     and tracks the theme, and the dark result is within a point of the literal
     it replaces. */
  --stage:#04100e; --barbg:color-mix(in srgb,var(--surface) 88%,transparent);
  --mono:var(--font-mono); --sans:var(--font-sans); --serif:var(--font-sans);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--sans);overflow:hidden}
a{color:inherit;text-decoration:none}

.bar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:1rem;
  height:3.4rem;padding:0 1.1rem;background:var(--barbg);border-bottom:1px solid var(--hairline);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
/* flex:none and nowrap: without them the link is the row's shrinkable item, so
   on a phone it wrapped to two lines inside a bar that is a fixed 3.4rem. */
.back{display:inline-flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--muted);
  padding:.4rem .7rem;border-radius:99px;border:1px solid transparent;
  flex:none;white-space:nowrap}
.back:hover{border-color:var(--line);color:var(--strong)}
.crumbs{display:flex;align-items:center;gap:.45rem;font-family:var(--serif);font-weight:500;
  font-size:1.02rem;color:var(--strong);min-width:0}
/* These are <button> so a keyboard can reach them -- they change what the
   graph is showing. That means undoing the user-agent button box, or they
   render as three grey chips in the middle of a breadcrumb. */
.crumbs .cr{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14rem;
  background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;
  line-height:inherit}
.crumbs .cr:hover{color:var(--accent)}
.crumbs .cr:last-child{cursor:default}
.crumbs .cr:last-child:hover{color:var(--strong)}
/* --muted, not --faint: on the light bar --faint is 3.93:1. */
.crumbs .sep{color:var(--muted);font-family:var(--sans);font-size:.85rem}
.bar .sp{flex:1}
.bar input{width:15rem;max-width:34vw;padding:.42rem .8rem;border:1px solid var(--line);
  border-radius:99px;background:var(--card);color:var(--strong);font-family:var(--sans);
  font-size:.82rem;outline:none}
.bar input::placeholder{color:var(--faint)}
.bar input:focus{border-color:var(--accent)}
.fitb{padding:.4rem .8rem;border-radius:99px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);font-size:.8rem;font-family:var(--sans);cursor:pointer;flex:none}
.fitb:hover{border-color:var(--accent);color:var(--strong)}

/* The rail carries the position the legend used to carry itself. The sheet
   wrapper inside it is display:contents here, so the chips stay direct flex
   children of the rail and this reads exactly as it always did. Below 720px
   the wrapper becomes a real bottom sheet -- see the media query. */
.lg-rail{position:fixed;left:1.1rem;bottom:1.1rem;z-index:20;max-width:min(46rem,70vw)}
.lg-rail[hidden]{display:none}
.lg-sheet{display:contents}
.lg-head,.lg-toggle,.lg-scrim{display:none}
.legend{display:flex;flex-wrap:wrap;gap:.4rem}
.lg{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .7rem;border-radius:99px;
  font-family:var(--sans);font-size:.74rem;color:#c9d8d2;background:rgba(198,232,218,.06);
  border:1px solid rgba(198,232,218,.1);cursor:pointer;user-select:none;appearance:none;
  transition:transform .16s ease,background .16s ease,border-color .16s ease}
.lg i{width:.55rem;height:.55rem;border-radius:99px;background:var(--c)}
.lg:hover{background:rgba(198,232,218,.12);transform:translateY(-1px)}
.lg.on{background:rgba(198,232,218,.16);color:#f2faf6;border-color:rgba(198,232,218,.3)}
/* --muted, not a .42 wash of --line: that measured 3.38:1 on the stage. */
.hint{position:fixed;right:1.1rem;bottom:1.1rem;z-index:20;font-size:.72rem;color:var(--muted)}

#stage{position:absolute;inset:0;background:#04100e;cursor:grab}
#stage:active{cursor:grabbing}
#dust{position:absolute;inset:0;z-index:4;pointer-events:none}
#vig{position:fixed;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(125% 105% at 50% 42%,transparent 52%,rgba(3,10,9,.48) 100%)}
#labels{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.02em;color:#f2faf6;white-space:nowrap;opacity:0;
  transition:opacity .18s linear;will-change:transform,opacity;
  pointer-events:auto;cursor:pointer;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 16px rgba(0,0,0,.75)}
.lab.lab-s{font-size:9.3px;color:#c9d8d2}
.lab:hover{opacity:1!important}
.scene-nav-info{display:none!important}
.scene-tooltip{font-family:var(--mono)!important;font-size:.72rem!important;
  color:#f2faf6!important;background:rgba(6,16,18,.92)!important;padding:.35rem .6rem!important;
  border-radius:8px!important;border:1px solid rgba(198,232,218,.14)}

.panel{position:fixed;top:4.4rem;right:1rem;bottom:1rem;width:min(400px,94vw);z-index:25;
  background:var(--ground);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 30px 70px -26px rgba(0,0,0,.55);display:none;flex-direction:column;overflow:hidden}
.panel.on{display:flex;animation:pin .34s cubic-bezier(.16,.84,.3,1)}
@keyframes pin{from{opacity:0;transform:translateX(18px)}}
.p-head{padding:1.15rem 1.25rem .9rem;border-bottom:1px solid var(--hairline)}
.p-eyebrow{display:flex;align-items:center;gap:.5rem;font-size:.68rem;font-weight:650;
  letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.p-eyebrow i{width:.55rem;height:.55rem;border-radius:99px;background:var(--c)}
.p-x{float:right;border:0;background:none;color:var(--faint);font-size:1.1rem;cursor:pointer;
  padding:.1rem .4rem;border-radius:8px}
.p-x:hover{background:var(--raise);color:var(--strong)}
.p-head h2{font-family:var(--serif);font-weight:500;font-size:1.45rem;color:var(--strong);
  margin:.45rem 0 .2rem;overflow-wrap:anywhere}
.p-path{font-family:var(--mono);font-size:.72rem;color:var(--faint);overflow-wrap:anywhere}
.p-body{flex:1;overflow-y:auto;padding:1rem 1.25rem 1.2rem;scrollbar-width:thin;
  scrollbar-color:var(--line) transparent}
.p-body p{margin:.2rem 0 1rem;font-size:.88rem;line-height:1.65;color:var(--ink)}
.p-cap{font-size:.68rem;font-weight:650;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);margin:1.1rem 0 .5rem}
.p-cap.p-dive{cursor:pointer;color:var(--accent)}
.p-cap.p-dive:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{font-family:var(--mono);font-size:.72rem;color:var(--ink);background:var(--raise);
  border:1px solid var(--hairline);border-radius:8px;padding:.24rem .55rem;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--strong)}
.sym{display:flex;align-items:baseline;gap:.55rem;padding:.26rem 0;font-size:.8rem}
.sym b{flex:none;display:inline-grid;place-items:center;width:1.25rem;height:1.25rem;
  border-radius:6px;background:var(--raise);border:1px solid var(--hairline);
  font-size:.62rem;font-weight:650;color:var(--muted)}
.sym a{font-family:var(--mono);color:var(--ink);overflow-wrap:anywhere}
.sym a:hover{color:var(--accent);text-decoration:underline}
.p-foot{padding: .85rem 1.25rem;border-top:1px solid var(--hairline)}
.p-open{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:600;
  color:var(--accent)}
.p-open:hover{text-decoration:underline}

.docwrap{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:rgba(3,10,9,.6);backdrop-filter:blur(7px)}
.docwrap.on{display:flex}
.doc-card{display:flex;flex-direction:column;width:min(900px,94vw);height:min(84vh,860px);
  background:var(--ground);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.7);animation:dpop .28s cubic-bezier(.2,.9,.3,1)}
@keyframes dpop{from{opacity:0;transform:translateY(18px) scale(.97)}}
.d-head{display:flex;align-items:center;gap:.7rem;padding:.85rem 1.1rem;
  border-bottom:1px solid var(--hairline)}
.d-kind{font-size:.66rem;font-weight:650;letter-spacing:.1em;text-transform:uppercase;
  padding:.22rem .55rem;border-radius:99px;background:var(--raise);color:var(--kc,var(--accent))}
.d-head h2{font-family:var(--serif);font-weight:500;font-size:1.1rem;color:var(--strong);
  margin:0;overflow-wrap:anywhere}
.d-head .sp{flex:1}
.d-btn{font-size:.78rem;font-family:var(--sans);color:var(--muted);background:var(--card);
  border:1px solid var(--line);border-radius:99px;padding:.34rem .75rem;cursor:pointer;flex:none}
.d-btn:hover{border-color:var(--accent);color:var(--strong)}
.d-x{border:0;background:none;color:var(--faint);font-size:1.2rem;cursor:pointer;
  padding:.1rem .45rem;border-radius:8px;flex:none}
.d-x:hover{background:var(--raise);color:var(--strong)}
#dframe{flex:1;width:100%;border:0;background:var(--card)}
.back:focus-visible,.fitb:focus-visible,.lg:focus-visible,.p-x:focus-visible,.d-btn:focus-visible,
.d-x:focus-visible,.chip:focus-visible,.bar input:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  .panel.on,.doc-card{animation:none}
  .lg{transition:none}.lg:hover{transform:none}
  .lg-sheet,.lg-scrim{transition:none}
}
@media (max-width:720px){
  .crumbs{display:none}
  .hint{display:none}
  /* Twenty subsystems whose labels run to 32 characters cannot share a row on
     a phone. Wrapped and anchored to the bottom they were roughly 650px of
     pills growing up over the whole stage, which is the one thing this page
     is for. Here the list moves into a sheet behind a single pill. */
  /* The rail stops being a positioned box here, and the pill and the sheet
     anchor to the viewport themselves. position:fixed creates a stacking
     context whatever its z-index, so while the rail was fixed the sheet's
     z-index only ranked it against its siblings inside the rail -- and the
     rail as a whole sat at 20, under the scrim at 29. The scrim covered the
     sheet and swallowed every tap on a chip. */
  .lg-rail{position:static;max-width:none}
  .lg-toggle{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;
    position:fixed;left:.7rem;bottom:.7rem;z-index:20;
    padding:.5rem 1rem;border-radius:99px;cursor:pointer;appearance:none;
    font-family:var(--sans);font-size:.8rem;color:var(--ink);
    background:var(--barbg);border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
  .lg-toggle .lg-n{font-family:var(--mono);color:var(--muted);
    max-width:11rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lg-toggle .lg-n.on{color:var(--accent-ink)}

  .lg-scrim{display:block;position:fixed;inset:0;z-index:29;background:rgba(3,10,9,.6);
    opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s}
  .lg-scrim.on{opacity:1;visibility:visible}

  .lg-sheet{display:flex;position:fixed;inset:auto 0 0 0;z-index:30;flex-direction:column;
    max-height:min(62vh,30rem);background:var(--ground);border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:0 -22px 60px -28px rgba(0,0,0,.7);
    padding-bottom:env(safe-area-inset-bottom);
    transform:translateY(101%);visibility:hidden;
    transition:transform .24s cubic-bezier(.16,.84,.3,1),visibility .24s}
  .lg-sheet.on{transform:none;visibility:visible}
  .lg-head{display:flex;align-items:center;gap:.6rem;flex:none;
    padding:.9rem .6rem .7rem 1rem;border-bottom:1px solid var(--hairline);
    font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--strong)}
  .lg-head .sp{flex:1}
  .lg-x{border:0;background:none;color:var(--faint);font-size:1.2rem;cursor:pointer;
    min-width:2.75rem;min-height:2.75rem;border-radius:8px}
  .lg-x:hover{background:var(--raise);color:var(--strong)}

  /* One column, scrolling, so the sheet's height is its own business and not
     the label lengths'. Selection is the inset marker, as everywhere else. */
  .legend{flex:1;flex-direction:column;flex-wrap:nowrap;gap:0;overflow-y:auto;
    padding:.35rem .6rem .8rem;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .lg{width:100%;min-height:2.75rem;padding:.55rem .7rem;border-radius:10px;border:0;
    background:none;font-size:.85rem;justify-content:flex-start;transition:background .16s ease}
  .lg i{width:.6rem;height:.6rem;flex:none}
  .lg:hover{background:var(--raise);transform:none}
  .lg.on{background:var(--accent-tint);color:var(--strong);
    box-shadow:inset 2px 0 0 var(--accent)}
}
</style>
</head>
<body>
<header class="bar">
<a class="back" href="../index.html">&#8592; UltraWideLock</a>
<nav class="crumbs" id="crumbs" aria-label="Graph depth"><button type="button" class="cr" data-i="0">The whole surface</button></nav>
<div class="sp"></div>
<input id="q" type="search" placeholder="Filter files &mdash; &#9166; jumps&hellip;"
       autocomplete="off" aria-label="Filter files by name">
<button id="fit" class="fitb" title="Frame everything (F)">Fit</button>
<button class="icon-btn" data-theme-toggle aria-pressed="false" title="Switch theme" aria-label="Switch theme"><svg class="sun" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><circle cx="8" cy="8" r="4"/><circle cx="8" cy="1.4" r="1.1"/><circle cx="8" cy="14.6" r="1.1"/><circle cx="1.4" cy="8" r="1.1"/><circle cx="14.6" cy="8" r="1.1"/></svg><svg class="moon" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 1a7 7 0 1 0 7 7 5.5 5.5 0 0 1-7-7Z"/></svg></button>
</header>
<div id="stage"></div>
<canvas id="dust"></canvas>
<div id="labels"></div>
<div id="vig"></div>
<div class="lg-scrim" id="lgscrim"></div>
<div class="lg-rail" id="lgrail">
<button class="lg-toggle" id="lgtoggle" type="button" aria-expanded="false" aria-controls="lgsheet">Subsystems <span class="lg-n" id="lgn"></span></button>
<div class="lg-sheet" id="lgsheet" aria-label="Subsystems">
<div class="lg-head"><span class="sp">Subsystems</span><button class="lg-x" id="lgx" type="button" aria-label="Close subsystem list">&#215;</button></div>
<div class="legend" id="legend"></div>
</div>
</div>
<div class="hint" id="hint">drag to orbit &middot; right-drag to pan &middot; scroll to zoom &middot; F fits &middot; double-click dives</div>
<aside class="panel" id="panel">
<div class="p-head">
<button class="p-x" id="px" aria-label="Close">&#215;</button>
<div class="p-eyebrow" id="pey"></div>
<h2 id="pname"></h2>
<div class="p-path" id="ppath"></div>
</div>
<div class="p-body" id="pbody"></div>
<div class="p-foot"><a class="p-open" id="popen" target="_blank" rel="noopener">Open reference page &#8599;</a></div>
</aside>
<div class="docwrap" id="doc">
<div class="doc-card">
<header class="d-head">
<b class="d-kind" id="dkind"></b>
<h2 id="dname"></h2>
<div class="sp"></div>
<button class="d-btn" id="dcopy">Copy link</button>
<a class="d-btn" id="dopen" target="_blank" rel="noopener">Open page &#8599;</a>
<button class="d-x" id="dx" aria-label="Close">&#215;</button>
</header>
<iframe id="dframe" title="Reference"></iframe>
</div>
</div>
<script src="@@LIB@@"></script>
<script id="gv3d-data" type="application/json">@@DATA@@</script>
<script>
(function(){
"use strict";
/* Theme is applied by the inline bootstrap in <head>, before the stylesheet,
   and toggled by the shared theme.js. What used to be here only ever set
   data-theme="dark": a reader who chose light got no attribute set at all and
   fell through to prefers-color-scheme, so on a dark-preferring OS their
   choice was silently discarded on every visit. This page also had no toggle
   to make that choice with -- there is one in the bar now, and it is the same
   control as on every other page. */

/* one flag, honored by every animated thing below: the float, the entrance,
   the auto-orbit, the halo pulse and the dust all sit behind it */
var RM=false;
try{RM=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}

var D=JSON.parse(document.getElementById("gv3d-data").textContent);
var colOf={},rgbOf={};
Object.keys(D.slots).forEach(function(g){
  var hex=D.colors[D.slots[g]%D.colors.length];colOf[g]=hex;
  var n=parseInt(hex.slice(1),16);rgbOf[g]=[n>>16&255,n>>8&255,n&255];
});
var byId={},outs={},ins={};
D.nodes.forEach(function(n){byId[n.id]=n;outs[n.id]=[];ins[n.id]=[]});
D.links.forEach(function(l){outs[l.source].push(l.target);ins[l.target].push(l.source)});
var deg={};D.nodes.forEach(function(n){deg[n.id]=outs[n.id].length+ins[n.id].length});

/* symbol kinds: function / type / macro — badge word and color */
var KMETA={f:["function","#2ee6b8",[217,119,87]],
           c:["type","#5fecc4",[95,236,196]],
           m:["macro","#d5a8f0",[213,168,240]]};

var sel=null,hov=null,near={},hnear={},iso=null,q="";
var stack=[],curNodes=D.nodes;
function visible(n){
  if(iso&&n.grp!==iso)return false;
  if(q&&((n.id+" "+n.name).toLowerCase().indexOf(q)<0))return false;
  return true;
}
/* hover isolates softly the way selection isolates hard: the pointed-at node
   and its neighbors come forward, the rest of the room falls half a step back */
function nodeColor(n){
  var c=n.kind&&KMETA[n.kind]?KMETA[n.kind][2]:(rgbOf[n.grp]||[150,150,150]);
  var a;
  if(!visible(n)||(sel&&n.id!==sel&&!near[n.id]))a=0.10;
  else{
    a=n.kind==="dep"||n.kind==="use"?0.78:0.94;
    if(sel&&n.id===sel)a=1;
    else if(!sel&&hov){
      if(n.id===hov.id)a=1;
      else if(hnear[n.id])a=0.96;
      else a*=0.42;
    }
  }
  return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";
}
function linkColor(l){
  var a=sel&&(l.source.id===sel||l.target.id===sel);
  if(sel&&!a)return "rgba(198,232,218,0.03)";
  if(iso&&(l.source.grp!==iso||l.target.grp!==iso))return "rgba(198,232,218,0.03)";
  if(a)return "rgba(198,232,218,0.6)";
  if(!sel&&hov){
    if(l.source.id===hov.id||l.target.id===hov.id)return "rgba(143,245,216,0.5)";
    return "rgba(198,232,218,0.04)";
  }
  var t=l.target,c=t.kind&&KMETA[t.kind]?KMETA[t.kind][2]:(rgbOf[l.source.grp]||[150,150,150]);
  return "rgba("+c[0]+","+c[1]+","+c[2]+","+(t.kind&&KMETA[t.kind]?0.3:0.26)+")";
}
var lastClick={id:null,t:0};
var stageEl=document.getElementById("stage");
/* the stage clears to an opaque near-black on purpose: the halo shells blend
   additively, and against a transparent canvas their rims would composite
   through near-zero destination alpha and vanish */
var Graph=ForceGraph3D({controlType:"orbit",
    rendererConfig:{antialias:true,alpha:true,powerPreference:"high-performance"}})(stageEl)
  .graphData({nodes:D.nodes,links:D.links})
  .backgroundColor("#04100e")
  .nodeVal(function(n){return n.val||1.6+(deg[n.id]||0)*0.55})
  .nodeResolution(24)
  .nodeColor(nodeColor)
  .nodeOpacity(1)
  .nodeLabel(function(n){
    if(n.kind&&KMETA[n.kind])return KMETA[n.kind][0]+" &middot; "+n.name;
    if(n.kind==="dep")return n.id+" &middot; dependency &mdash; click to dive";
    if(n.kind==="use")return n.id+" &middot; uses this file &mdash; click to dive";
    if(n.kind==="file")return n.id+" &middot; click for its reference page";
    return n.id+" &middot; "+(outs[n.id]||[]).length+"&#8599; "+(ins[n.id]||[]).length+"&#8601;";
  })
  .linkColor(linkColor)
  .linkOpacity(1)
  .linkWidth(function(l){return sel&&(l.source.id===sel||l.target.id===sel)?1.2:0})
  .linkDirectionalParticles(function(l){return sel&&(l.source.id===sel||l.target.id===sel)?2:0})
  .linkDirectionalParticleWidth(2.1)
  .linkDirectionalParticleColor(function(){return "#8ff5d8"})
  .linkDirectionalParticleSpeed(0.0055)
  .warmupTicks(90)
  .cooldownTicks(RM?240:Infinity)
  .d3VelocityDecay(0.32)
  .onNodeHover(function(n){
    n=n||null;
    if(n===hov)return;
    stageEl.style.cursor=n?"pointer":"";
    if(!RM){
      if(hov&&hov.__threeObj)scaleTo(hov.__threeObj,1);
      if(n&&n.__threeObj)scaleTo(n.__threeObj,1.2);
    }
    hov=n;hnear={};
    if(n){
      (outs[n.id]||[]).forEach(function(t){hnear[t]=1});
      (ins[n.id]||[]).forEach(function(t){hnear[t]=1});
    }
    if(!sel)refresh();else reglaze();
  })
  .onNodeClick(function(n){
    var now=Date.now();
    if(!stack.length&&n.id===lastClick.id&&now-lastClick.t<340){
      lastClick={id:null,t:0};dive(n.id);return;
    }
    lastClick={id:n.id,t:now};
    nodeAct(n);
  })
  .onBackgroundClick(function(){select(null)});

/* steering: orbit controls with inertia — drag to orbit, right-drag to pan,
   the wheel zooms toward the cursor; F or the Fit button reframes everything.
   A slow auto-orbit runs until the first touch or flight */
var ctr=Graph.controls();
ctr.enableDamping=true;ctr.dampingFactor=0.085;
ctr.screenSpacePanning=true;
if("zoomToCursor" in ctr)ctr.zoomToCursor=true;
ctr.zoomSpeed=1.3;ctr.rotateSpeed=0.85;
ctr.autoRotate=!RM;ctr.autoRotateSpeed=0.4;
ctr.minDistance=25;ctr.maxDistance=4200;
var touched=false;
function wake(){ctr.autoRotate=false;touched=true}
["pointerdown","wheel"].forEach(function(ev){
  stageEl.addEventListener(ev,wake,{once:true,passive:true});
});
function fitAll(){wake();if(stack.length)Graph.zoomToFit(700,100);else frameAll(700)}
document.getElementById("fit").addEventListener("click",fitAll);

/* the arrival: a longer lens, the camera a step back in the dark, and one
   slow glide down onto the warmed-up layout. Reduced motion just frames it.
   The fit itself is dispatched from the tick loop once every node has its
   mesh — on a fixed timer a cold start can fit an empty scene and park the
   camera inside the graph */
var cam0=Graph.camera();cam0.fov=60;cam0.updateProjectionMatrix();
Graph.cameraPosition({x:-170,y:330,z:1560});
/* framing computed from node positions, never from mesh bounding boxes —
   a mesh's world matrix is only trustworthy after it has rendered, and a
   fit taken before that collapses to the controls' minimum distance */
function frameAll(ms,filter){
  var lo=[1/0,1/0,1/0],hi=[-1/0,-1/0,-1/0];
  curNodes.forEach(function(n){
    if(filter&&!filter(n))return;
    if(typeof n.x!=="number")return;
    var p=[n.x,n.y,n.z];
    for(var i=0;i<3;i++){if(p[i]<lo[i])lo[i]=p[i];if(p[i]>hi[i])hi[i]=p[i]}
  });
  if(lo[0]>hi[0])return;
  var c={x:(lo[0]+hi[0])/2,y:(lo[1]+hi[1])/2,z:(lo[2]+hi[2])/2};
  var R=Math.max(hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2])/2+34;
  var cam=Graph.camera();
  var vf=Math.tan(cam.fov*Math.PI/360);
  var hf=vf*(cam.aspect||innerWidth/innerHeight);
  var d=R/Math.min(vf,hf)*1.1;
  var p=cam.position,cur=Math.hypot(p.x-c.x,p.y-c.y,p.z-c.z)||1,k=d/cur;
  Graph.cameraPosition({x:c.x+(p.x-c.x)*k,y:c.y+(p.y-c.y)*k,z:c.z+(p.z-c.z)*k},c,ms);
}
var pendingFit="intro",fitWait=0;
function tryFit(){
  if(!pendingFit||dressPending)return;
  if(++fitWait<4)return;
  var mode=pendingFit;pendingFit=null;
  if(mode==="intro"&&touched)return;
  frameAll(RM?300:(mode==="intro"?1650:900));
}

/* physics: gentle repulsion, short in-cluster links, cluster cohesion, and a
   containment sphere so leaf files hang near their constellation instead of
   drifting to infinity. In a dive, symbols sit close and portals ring wide */
Graph.d3Force("charge").strength(-70);
function kdist(k){
  if(k==="f"||k==="c"||k==="m")return 60;
  if(k==="dep"||k==="use")return 165;
  return 0;
}
Graph.d3Force("link").distance(function(l){
  var s=l.source,t=l.target;
  if(typeof s!=="object"||typeof t!=="object")return 60;
  var d=Math.max(kdist(s.kind),kdist(t.kind));
  if(d)return d;
  return s.grp===t.grp?34:95;
});
var nds=[];
function fCluster(alpha){
  var c={};
  nds.forEach(function(n){
    var b=c[n.grp]||(c[n.grp]={x:0,y:0,z:0,m:0});
    b.x+=n.x;b.y+=n.y;b.z+=n.z;b.m++;
  });
  var k=alpha*0.07;
  nds.forEach(function(n){
    var b=c[n.grp];if(b.m<2)return;
    n.vx+=(b.x/b.m-n.x)*k;n.vy+=(b.y/b.m-n.y)*k;n.vz+=(b.z/b.m-n.z)*k;
  });
}
fCluster.initialize=function(a){nds=a};
function fContain(alpha){
  var R=250;
  nds.forEach(function(n){
    var r=Math.hypot(n.x,n.y,n.z);
    if(r>R){var k=(r-R)/r*alpha*0.14;n.vx-=n.x*k;n.vy-=n.y*k;n.vz-=n.z*k}
  });
}
fContain.initialize=function(a){nds=a};
Graph.d3Force("cluster",fCluster);
Graph.d3Force("contain",fContain);

/* the float: the simulation is held warm at a whisper of alpha instead of
   being allowed to die, and every free node gets a slow phase-shifted swell
   on each axis — the constellation breathes instead of freezing. The other
   forces stay live at that alpha, so the structure corrects itself under
   the drift. Skipped entirely under reduced motion, where the sim settles
   and stops exactly as it used to */
if(!RM){
  if(Graph.d3AlphaMin)Graph.d3AlphaMin(0);
  if(Graph.d3AlphaTarget)Graph.d3AlphaTarget(0.012);
  /* offsets, not velocity impulses: each tick removes last tick's offset and
     applies this tick's, so the swell telescopes to exactly zero net drift.
     An impulse-based float pumps energy at uncapped frame rates and slowly
     balloons the whole layout past the camera */
  var nds3=[];
  var fFloat=function(){
    var t=Date.now()*0.001;
    for(var i=0;i<nds3.length;i++){
      var n=nds3[i];
      if(n.fx!=null)continue;
      var p=t*n.__w,a=n.__amp;
      var o1=Math.sin(p+n.__p1)*a,o2=Math.sin(p*0.93+n.__p2)*a,o3=Math.sin(p*1.08+n.__p3)*a;
      n.x+=o1-n.__o1;n.y+=o2-n.__o2;n.z+=o3-n.__o3;
      n.__o1=o1;n.__o2=o2;n.__o3=o3;
    }
  };
  fFloat.initialize=function(a){
    nds3=a;
    a.forEach(function(n){
      if(n.__p1==null){
        n.__p1=Math.random()*6.28;n.__p2=Math.random()*6.28;n.__p3=Math.random()*6.28;
        n.__w=0.45+Math.random()*0.5;n.__amp=1.6+Math.random()*1.8;
        n.__o1=0;n.__o2=0;n.__o3=0;
      }
    });
  };
  Graph.d3Force("float",fFloat);
}

/* lighting: reshape the stock ambient+directional rig into a key/fill/rim
   trio — warm key from above, cool fill, a faint coral rim from below —
   so the spheres read as lit objects instead of flat blobs */
(function(){
  var amb=null,dir=null,scene=Graph.scene();
  scene.traverse(function(o){
    if(o.type==="AmbientLight")amb=amb||o;
    else if(o.type==="DirectionalLight")dir=dir||o;
  });
  if(amb){amb.color.set("#bfe6d8");amb.intensity*=0.65}
  if(dir){
    dir.color.set("#dff6fa");dir.intensity*=0.95;
    dir.position.set(650,900,420);
    var fill=dir.clone();
    fill.color.set("#7fd8c4");fill.intensity=dir.intensity*0.35;
    fill.position.set(-450,250,720);scene.add(fill);
    var rim=dir.clone();
    rim.color.set("#2ee6b8");rim.intensity=dir.intensity*0.4;
    rim.position.set(-600,-700,-500);scene.add(rim);
  }
  /* depth haze: three duck-types scene.fog, so a bare isFogExp2 object is a
     working exponential fog without needing a constructor the bundle never
     exports — far clusters sink into the room instead of pinning to it */
  try{
    var CC=(amb||dir)?(amb||dir).color.constructor:null;
    if(CC)scene.fog={isFogExp2:true,color:new CC(0x0e0c0b),density:0.00082,
      name:"",clone:function(){return this},toJSON:function(){return {}}};
  }catch(e){}
})();

/* dressing: every node mesh gets an additive back-face shell — the glow that
   makes a sphere read as a body of light instead of a painted disc. The shell
   is cloned from the node's own material and geometry, so nothing here names
   a library internal, and it is taken out of the raycaster's reach so the
   pointer still lands on the core. New meshes also get their entrance:
   scale from nothing on a 6ms beat, softly, cluster after cluster */
var animObjs=[],introSeq=0,dressPending=true,glazeN=0;
function reglaze(){glazeN=3}
function scaleTo(o,t){o.__sT=t;o.__delay=0;if(animObjs.indexOf(o)<0)animObjs.push(o)}
function dressAll(now){
  var all=true,fresh=0;
  curNodes.forEach(function(n){
    var o=n.__threeObj;
    if(!o){all=false;return}
    if(o.__dressed)return;
    o.__dressed=true;fresh++;
    try{
      var hm=o.material.clone();
      hm.color.setRGB(0,0,0);
      hm.transparent=true;hm.opacity=0;hm.depthWrite=false;
      hm.side=1;hm.blending=2;/* BackSide, additive */
      /* without this the shell's silhouette cuts a hard ring; a fresnel
         falloff on the back faces melts it into a glow. The far side of the
         shell faces away from the camera, so the dot is negative at the
         center and zero at the rim — abs gives bright-inside, soft-out */
      hm.onBeforeCompile=function(sh){
        sh.fragmentShader=sh.fragmentShader.replace(
          "#include <dithering_fragment>",
          "#include <dithering_fragment>\n"+
          "gl_FragColor.a*=pow(abs(dot(normalize(vNormal),normalize(vViewPosition))),1.4);");
      };
      var h=new o.constructor(o.geometry,hm);
      h.scale.setScalar(1.55);h.raycast=function(){};h.__base=0;
      o.add(h);o.__halo=h;
    }catch(e){}
    if(!RM){
      o.scale.setScalar(0.001);o.__sT=1;
      o.__delay=now+(introSeq++)*6;
      animObjs.push(o);
    }
  });
  if(all)dressPending=false;
  if(fresh)reglaze();
}

/* self-illumination and halo state follow the lib's own material color, so
   dimming, hover and selection all flow through one place. Runs for a few
   frames after any restyle, not per frame — the halo pulse in the tick loop
   is the only thing that touches materials continuously */
function glaze(){
  if(glazeN<=0)return;glazeN--;
  var seen=[];
  curNodes.forEach(function(n){
    var o=n.__threeObj;
    if(!o||!o.material)return;
    var m=o.material,op=m.opacity==null?1:m.opacity;
    if(seen.indexOf(m)<0){
      seen.push(m);
      if(m.emissive)m.emissive.copy(m.color).multiplyScalar(0.3*op);
    }
    var h=o.__halo;
    if(h){
      var hot=(sel&&n.id===sel)||(hov&&hov.id===n.id);
      h.material.emissive.copy(m.color);
      h.__base=Math.min(0.85,(hot?0.4:0.19)*op);
      if(RM)h.material.opacity=h.__base;
    }
  });
}

function refresh(){Graph.nodeColor(Graph.nodeColor());reglaze()}

function esc(s){var d=document.createElement("i");d.textContent=s;return d.innerHTML}
function chip(id){return '<span class="chip" data-go="'+esc(id)+'">'+esc(id.split("/").pop())+"</span>"}
/* swatch + label, built as nodes rather than markup: the colour lands in a
   style property and the group name in a text node, so neither can be read
   back as HTML. */
function swatch(el,g){
  el.textContent="";
  var i=document.createElement("i");
  i.style.setProperty("--c",colOf[g]);
  el.appendChild(i);
  el.appendChild(document.createTextNode(g));
}

/* what a click means depends on where you are: on the surface it selects,
   in a dive a symbol opens its line on the source browser and an outer file
   dives deeper */
function nodeAct(n){
  if(stack.length){
    if(n.url)window.open(n.url,"_blank","noopener");
    else dive(n.id);
  }else select(n,true);
}

/* labels: on the surface, every cluster hub plus the highest-degree files;
   in a dive, everything (or just the file and its portals when the API is
   huge). Quiet until hover or selection brings them forward */
var important={};
(function(){
  var hubs={};
  D.nodes.forEach(function(n){
    if(!hubs[n.grp]||deg[n.id]>deg[hubs[n.grp].id])hubs[n.grp]=n;
  });
  Object.keys(hubs).forEach(function(g){important[hubs[g].id]=1});
  D.nodes.slice().sort(function(a,b){return deg[b.id]-deg[a.id]})
    .slice(0,18).forEach(function(n){important[n.id]=1});
})();
var labWrap=document.getElementById("labels"),labs={};
function ensureLab(n){
  var L=labs[n.id];
  if(L){L.n=n;return}
  var el=document.createElement("div");
  el.className="lab"+(n.url?" lab-s":"");
  el.textContent=n.name;
  el.addEventListener("click",function(){nodeAct(labs[n.id].n)});
  labWrap.appendChild(el);
  labs[n.id]={el:el,n:n};
}
labWrap.addEventListener("wheel",function(e){
  try{
    var cv=document.querySelector("#stage canvas");
    if(cv)cv.dispatchEvent(new WheelEvent("wheel",e));
  }catch(x){}
},{passive:true});
function syncLabs(){
  var want={};
  if(stack.length){
    if(curNodes.length<=52)curNodes.forEach(function(n){want[n.id]=n});
    else curNodes.forEach(function(n){if(!n.url)want[n.id]=n});
  }else{
    Object.keys(important).forEach(function(k){want[k]=byId[k]});
    if(sel&&byId[sel]){
      want[sel]=byId[sel];
      Object.keys(near).forEach(function(k){if(byId[k])want[k]=byId[k]});
    }
  }
  Object.keys(labs).forEach(function(id){
    if(!want[id]){labWrap.removeChild(labs[id].el);delete labs[id]}
  });
  Object.keys(want).forEach(function(id){ensureLab(want[id])});
}
syncLabs();
/* the dust: two sheets of near-camera motes on a 2D canvas over the stage,
   panned with the camera's azimuth at different rates — parallax that gives
   the flight a sense of medium without costing the scene a single draw call.
   The azimuth is unwrapped so crossing the ±180° seam never jumps a sheet */
var dust=(function(){
  var cv=document.getElementById("dust"),cx=cv.getContext("2d");
  var W=0,H=0,nearS=null,farS=null,lastRaw=null,acc=0,lastAcc=null;
  function sheet(count,rmax,warm){
    var c=document.createElement("canvas");
    c.width=Math.max(2,W*2);c.height=Math.max(2,H);
    var g=c.getContext("2d");
    for(var i=0;i<count;i++){
      var r=Math.random();
      g.globalAlpha=0.05+r*0.2;
      g.fillStyle=Math.random()<warm?"#6fd7c0":"#9fd0ff";
      g.beginPath();
      g.arc(Math.random()*c.width,Math.random()*c.height,0.5+r*rmax,0,6.29);
      g.fill();
    }
    return c;
  }
  function size(){
    W=cv.width=innerWidth;H=cv.height=innerHeight;
    farS=sheet(120,0.8,0.22);nearS=sheet(55,1.5,0.3);
    lastAcc=null;
  }
  function paint(img,f){
    var o=(((f%1)+1)%1)*img.width;
    cx.drawImage(img,-o,0);cx.drawImage(img,img.width-o,0);
  }
  function draw(az){
    if(lastRaw!=null){
      var d=az-lastRaw;
      if(d>3.14)d-=6.283;else if(d<-3.14)d+=6.283;
      acc+=d;
    }
    lastRaw=az;
    if(lastAcc!=null&&Math.abs(acc-lastAcc)<0.0006)return;
    lastAcc=acc;
    cx.clearRect(0,0,W,H);
    var t=acc/6.283;
    paint(farS,t*0.5);paint(nearS,t*1.15);
  }
  size();
  return {size:size,draw:draw};
})();

var camDirV=null;

/* The simulation is deliberately never allowed to cool -- cooldownTicks is
   Infinity, d3AlphaTarget is nonzero and the camera auto-orbits -- so this
   loop runs WebGL, a force simulation and two dust canvases for as long as the
   page is open. That is the intended look while someone is watching it. It is
   not defensible while the tab is in the background, where it was still doing
   all of it for nobody. Parked on hidden, restarted on return. */
var tickOn=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden){tickOn=false;return;}
  if(!tickOn){tickOn=true;requestAnimationFrame(tick);}
});

function tick(){
  if(tickOn)requestAnimationFrame(tick);
  var now=performance.now();
  if(dressPending)dressAll(now);
  tryFit();
  glaze();
  for(var ai=animObjs.length-1;ai>=0;ai--){
    var ao=animObjs[ai];
    if(ao.__delay&&now<ao.__delay)continue;
    var s=ao.scale.x+(ao.__sT-ao.scale.x)*0.16;
    if(Math.abs(s-ao.__sT)<0.004){s=ao.__sT;animObjs.splice(ai,1)}
    ao.scale.setScalar(s);
  }
  if(!RM){
    var tp=now*0.001;
    for(var ni=0;ni<curNodes.length;ni++){
      var nn=curNodes[ni],no=nn.__threeObj,nh=no&&no.__halo;
      if(nh)nh.material.opacity=nh.__base*(0.86+0.14*Math.sin(tp*(nn.__w||1)*2+(nn.__p1||0)));
    }
  }
  if(ctr.update)ctr.update();
  var cam=Graph.camera();
  dust.draw(Math.atan2(cam.position.x,cam.position.z));
  if(!camDirV)camDirV=cam.position.clone();
  cam.getWorldDirection(camDirV);
  Object.keys(labs).forEach(function(id){
    var n=labs[id].n,el=labs[id].el;
    if(typeof n.x!=="number"){el.style.opacity=0;return}
    var dx=n.x-cam.position.x,dy=n.y-cam.position.y,dz=n.z-cam.position.z;
    if(dx*camDirV.x+dy*camDirV.y+dz*camDirV.z<=0||!visible(n)){el.style.opacity=0;return}
    var dist=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    var a;
    if(sel)a=n.id===sel?1:(near[n.id]?0.8:0.05);
    else if(hov&&hov.id===n.id)a=1;
    else{var t=Math.max(0,Math.min(1,(950-dist)/650));a=0.12+0.34*t}
    var s=(sel&&n.id===sel)||(hov&&hov.id===n.id)?1.1
      :Math.max(0.85,Math.min(1.05,520/dist));
    var p=Graph.graph2ScreenCoords(n.x,n.y,n.z);
    el.style.opacity=a;
    el.style.transform="translate("+p.x+"px,"+p.y+"px) translate(-50%,-150%) scale("+s+")";
  });
}
tick();

function select(n,fly){
  sel=n?n.id:null;near={};
  var panel=document.getElementById("panel");
  if(!n){panel.classList.remove("on");syncLabs();refresh();return}
  outs[n.id].forEach(function(t){near[t]=1});
  ins[n.id].forEach(function(t){near[t]=1});
  swatch(document.getElementById("pey"),n.grp);
  document.getElementById("pname").textContent=n.name;
  document.getElementById("ppath").textContent=n.id;
  var b="";
  if(n.blurb)b+="<p>"+esc(n.blurb)+"</p>";
  if(outs[n.id].length)b+='<div class="p-cap">Depends on &middot; '+outs[n.id].length+
    '</div><div class="chips">'+outs[n.id].map(chip).join("")+"</div>";
  if(ins[n.id].length)b+='<div class="p-cap">Used by &middot; '+ins[n.id].length+
    '</div><div class="chips">'+ins[n.id].map(chip).join("")+"</div>";
  var syms=D.syms[n.slug]||[];
  if(syms.length){
    b+='<div class="p-cap p-dive" data-dive="'+esc(n.id)+'">API surface &middot; '+
      syms.length+" &mdash; explore in 3D &#8600;</div>";
    syms.forEach(function(s){
      b+='<div class="sym"><b>'+{f:"F",c:"T",m:"#"}[s[0]]+"</b><a data-k=\""+s[0]+
        "\" target=\"_blank\" rel=\"noopener\" href=\""+esc(s[2])+'">'+esc(s[1])+"</a></div>";
    });
  }
  document.getElementById("pbody").innerHTML=b;
  document.getElementById("popen").setAttribute("href",n.slug);
  panel.classList.add("on");
  syncLabs();
  refresh();
  if(fly&&typeof n.x==="number"){
    wake();
    var d=85+Math.sqrt(deg[n.id])*9,r=Math.hypot(n.x,n.y,n.z)||1,k=1+d/r;
    Graph.cameraPosition({x:n.x*k,y:n.y*k,z:n.z*k},n,900);
  }
}
document.getElementById("pbody").addEventListener("click",function(e){
  var t=e.target;
  var dv=t.closest("[data-dive]");
  if(dv){dive(dv.getAttribute("data-dive"));return}
  /* Symbol rows are plain links to the source browser and are left alone.
     They used to be intercepted into openDoc(), which loaded the URL into an
     iframe -- and every one of those URLs is a github.com blob page, which
     sends X-Frame-Options: deny. The frame could never paint. The onload
     handler then reached for its contentDocument, threw cross-origin, and was
     swallowed by a bare catch, so the failure was silent and the pane just sat
     there empty. A target="_blank" anchor does what that was trying to do. */
  if(t.closest(".sym a"))return;
  var go=t.getAttribute&&t.getAttribute("data-go");
  if(go&&byId[go])select(byId[go],true);
});
document.getElementById("px").addEventListener("click",function(){select(null)});

/* the dive: one file becomes a fixed sun, its API symbols the close orbit,
   its dependencies and users an outer ring of portals to dive on through */
function layerData(id){
  var f=byId[id],nodes=[],links=[],seen={};
  nodes.push({id:f.id,name:f.name,grp:f.grp,slug:f.slug,blurb:f.blurb,
    kind:"file",val:16,fx:0,fy:0,fz:0});
  seen[id]=1;
  (D.syms[f.slug]||[]).forEach(function(s){
    var sid="s:"+s[2];
    nodes.push({id:sid,name:s[1],kind:s[0],url:s[2],grp:f.grp,val:1.5});
    links.push({source:id,target:sid});
  });
  outs[id].forEach(function(t){
    if(seen[t])return;seen[t]=1;var o=byId[t];
    nodes.push({id:t,name:o.name,grp:o.grp,slug:o.slug,blurb:o.blurb,kind:"dep",val:5});
    links.push({source:id,target:t});
  });
  ins[id].forEach(function(t){
    if(seen[t])return;seen[t]=1;var o=byId[t];
    nodes.push({id:t,name:o.name,grp:o.grp,slug:o.slug,blurb:o.blurb,kind:"use",val:5});
    links.push({source:t,target:id});
  });
  return {nodes:nodes,links:links};
}
function dive(id){
  if(!byId[id])return;
  stack.push(id);
  setMode();
}
/* Buttons, not spans. These change what the graph is showing, so they are
   controls, and a control a keyboard cannot reach is not one. */
function renderCrumbs(){
  var h='<button type="button" class="cr" data-i="0">The whole surface</button>';
  stack.forEach(function(id,i){
    h+='<span class="sep">&#8250;</span><button type="button" class="cr" data-i="'+(i+1)+'">'+
      esc(byId[id].name)+"</button>";
  });
  document.getElementById("crumbs").innerHTML=h;
}
document.getElementById("crumbs").addEventListener("click",function(e){
  var i=e.target.getAttribute&&e.target.getAttribute("data-i");
  if(i==null)return;
  i=+i;
  if(i===stack.length)return;
  stack=stack.slice(0,i);
  setMode();
});
function setMode(){
  select(null);
  closeDoc();
  iso=null;
  var legendEl=document.getElementById("legend");
  Array.prototype.forEach.call(legendEl.children,function(c){
    c.classList.remove("on");c.setAttribute("aria-pressed","false")});
  var top=stack.length?stack[stack.length-1]:null;
  if(top){
    var L=layerData(top);
    curNodes=L.nodes;
    setLegendShown(false);
    Graph.graphData(L);
    Graph.cameraPosition({x:0,y:60,z:430},{x:0,y:0,z:0},700);
  }else{
    curNodes=D.nodes;
    setLegendShown(true);
    Graph.graphData({nodes:D.nodes,links:D.links});
  }
  document.getElementById("hint").innerHTML=stack.length
    ?"click a symbol for its docs &middot; click an outer file to dive on &middot; Esc backs out"
    :"drag to orbit &middot; right-drag to pan &middot; scroll to zoom &middot; F fits &middot; double-click dives";
  renderCrumbs();
  animObjs.length=0;introSeq=0;dressPending=true;
  if(!top){pendingFit="mode";fitWait=0}
  wake();
  syncLabs();
  refresh();
}

/* the doc overlay: the real reference page in a themed card, chrome hidden,
   scrolled to the symbol — live from the site, closable back to the graph */
var docEl=document.getElementById("doc"),dframe=document.getElementById("dframe");
function openDoc(o){
  var url=o.url||o.slug;
  if(!url)return;
  var km=KMETA[o.kind];
  var badge=document.getElementById("dkind");
  badge.textContent=km?km[0]:"file";
  badge.style.setProperty("--kc",km?km[1]:"");
  document.getElementById("dname").textContent=o.name;
  document.getElementById("dopen").setAttribute("href",url);
  dframe.onload=function(){
    try{
      var d=dframe.contentDocument;
      if(!d||d.getElementById("gv3d-strip"))return;
      var st=d.createElement("style");
      st.id="gv3d-strip";
      st.textContent=".side,.topbar,.toc-rail,.scrim,.palette{display:none!important}"+
        ".app{display:block!important}"+
        ".content{margin:0!important;max-width:none!important}"+
        "main.doc{margin:0 auto!important;padding:1.2rem 1.6rem 3rem!important}"+
        ":target{scroll-margin-top:1.2rem}"+
        "section.api-entry:target{animation:gvmark 1.8s ease}"+
        "@keyframes gvmark{0%{background:rgba(46,230,184,.16);"+
        "box-shadow:0 0 0 10px rgba(46,230,184,.16);border-radius:10px}"+
        "100%{background:transparent;box-shadow:none}}";
      d.head.appendChild(st);
      var anchor=url.split("#")[1];
      if(anchor){
        var target=d.getElementById(anchor);
        if(target)target.scrollIntoView({block:"start"});
      }
    }catch(e){}
  };
  dframe.src=url;
  docEl.classList.add("on");
}
function closeDoc(){
  if(!docEl.classList.contains("on"))return;
  docEl.classList.remove("on");
  dframe.src="about:blank";
}
document.getElementById("dx").addEventListener("click",closeDoc);
docEl.addEventListener("click",function(e){if(e.target===docEl)closeDoc()});
document.getElementById("dcopy").addEventListener("click",function(){
  var self=this,href=document.getElementById("dopen").getAttribute("href");
  try{
    navigator.clipboard.writeText(new URL(href,location.href).href).then(function(){
      self.textContent="Copied ✓";
      setTimeout(function(){self.textContent="Copy link"},1400);
    });
  }catch(e){}
});

addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if(lgOpen())lgSheetOpen(false);
    else if(docEl.classList.contains("on"))closeDoc();
    else if(sel)select(null);
    else if(stack.length){stack.pop();setMode()}
  }
  else if((e.key==="f"||e.key==="F")&&!/INPUT|TEXTAREA/.test(e.target.tagName))fitAll();
});

var legend=document.getElementById("legend");
Object.keys(D.slots).sort().forEach(function(g){
  if(!D.nodes.some(function(n){return n.grp===g}))return;
  var el=document.createElement("button");
  el.type="button";el.className="lg";el.setAttribute("aria-pressed","false");
  swatch(el,g);
  el.addEventListener("click",function(){
    iso=iso===g?null:g;
    Array.prototype.forEach.call(legend.children,function(c){
      c.classList.remove("on");c.setAttribute("aria-pressed","false")});
    if(iso){el.classList.add("on");el.setAttribute("aria-pressed","true")}
    refresh();
    lgSync();
    lgSheetOpen(false);
    if(iso){wake();frameAll(700,function(n){return n.grp===g})}
    else fitAll();
  });
  legend.appendChild(el);
});

/* Below 720px the chips live in a sheet behind one pill (see the media query),
   because twenty of them wrapped is taller than a phone. The pill carries the
   count at rest and the isolated subsystem's name once one is picked, so the
   thing the graph is currently showing is readable without opening anything.
   Above that width every rule here is inert: the sheet is display:contents,
   the pill and the scrim are display:none, and nothing below has an effect. */
var lgSheet=document.getElementById("lgsheet"),
    lgScrim=document.getElementById("lgscrim"),
    lgToggle=document.getElementById("lgtoggle"),
    lgRail=document.getElementById("lgrail"),
    lgX=document.getElementById("lgx"),
    lgN=document.getElementById("lgn");

function lgOpen(){return lgSheet.classList.contains("on")}
function lgSheetOpen(on){
  if(on===lgOpen())return;
  var inside=lgSheet.contains(document.activeElement);
  lgSheet.classList.toggle("on",on);
  lgScrim.classList.toggle("on",on);
  lgToggle.setAttribute("aria-expanded",on?"true":"false");
  /* Only move focus when it is already in play here, or opening the sheet
     would yank a mouse user's caret out of the filter field. */
  if(on&&document.activeElement===lgToggle)lgX.focus();
  else if(!on&&inside)lgToggle.focus();
}
function lgSync(){
  /* The prefix is what makes these too wide to wrap; inside the pill it is
     also the least useful half of the name. */
  lgN.textContent=iso?iso.replace(/^.*\//,""):String(legend.children.length);
  lgN.classList.toggle("on",!!iso);
}
function setLegendShown(on){
  lgRail.hidden=!on;
  if(!on)lgSheetOpen(false);
}
lgToggle.addEventListener("click",function(){lgSheetOpen(!lgOpen())});
lgX.addEventListener("click",function(){lgSheetOpen(false)});
lgScrim.addEventListener("click",function(){lgSheetOpen(false)});
/* A sheet is a dialog while it is open: Tab stays inside it. */
lgSheet.addEventListener("keydown",function(e){
  if(e.key!=="Tab"||!lgOpen())return;
  var f=lgSheet.querySelectorAll("button:not([disabled])");
  if(!f.length)return;
  var first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});
/* The dialog role is only true while the sheet is a sheet. Above 720px the
   wrapper is display:contents and the chips are just a row on the page, so
   leaving role="dialog" in the markup would announce a dialog that is not one.
   Rotating a phone into that width also has to put the sheet away. */
var lgNarrow=matchMedia("(max-width:720px)");
function lgRole(){
  if(lgNarrow.matches){
    lgSheet.setAttribute("role","dialog");
    lgSheet.setAttribute("aria-modal","true");
  }else{
    lgSheetOpen(false);
    lgSheet.removeAttribute("role");
    lgSheet.removeAttribute("aria-modal");
  }
}
lgRole();
try{lgNarrow.addEventListener("change",lgRole)}catch(e){}
lgSync();
document.getElementById("q").addEventListener("input",function(){
  q=this.value.trim().toLowerCase();refresh();
});
document.getElementById("q").addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var s=this.value.trim().toLowerCase();
  if(!s)return;
  var best=null,bs=0;
  curNodes.forEach(function(n){
    if(!visible(n))return;
    var nm=n.name.toLowerCase(),sc=
      nm===s?4:nm.indexOf(s)===0?3:nm.indexOf(s)>=0?2:n.id.toLowerCase().indexOf(s)>=0?1:0;
    if(sc>bs){bs=sc;best=n}
  });
  if(best)nodeAct(best);
});

addEventListener("resize",function(){Graph.width(innerWidth).height(innerHeight);dust.size()});
if(location.hash==="#debug")window.__g={graph:Graph,ctr:ctr};
})();
</script>
