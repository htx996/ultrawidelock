# The website: render web/dist and publish it to GitHub Pages.
#
# One of the repository's two workflows -- ci.yml gates pull requests -- and
# this one exists because deploying Pages is the one step that cannot be done
# from a laptop. Everything else stays manual on purpose: `make check` runs the
# host suites in seconds, `make fw-check` links the Zephyr images, and `make
# esp-release` builds and bundles the ESP32 firmware. None of that belongs here.
# A previous incarnation of this repository carried nine workflows and 2515
# lines of YAML, including 805 lines that rebuilt firmware on every push; the
# firmware build alone took hours, and it verified nothing a local `make` had
# not already verified.
#
# No push trigger, deliberately:
#
#   - the repository's first push would otherwise publish the site in the same
#     action that publishes the code, and those are two decisions, not one.
#   - a site rebuild is worth starting when the prose changed, which a human
#     knows and a push trigger does not.
#
# A PUBLISHED RELEASE IS THE EXCEPTION, and it is not the same decision as a
# push. This site serves the firmware: the flasher page reads ota-index.json out
# of the LATEST release's assets, so between publishing a release and rebuilding
# the site by hand, the page keeps offering the previous release's updates and
# says nothing is wrong. A board updated in that window installs a version that
# is no longer current, and the only symptom is a version number nobody is
# looking at. That is a stale-artifact failure with no error anywhere, which is
# the kind worth removing rather than remembering.
#
# SO WHY IS THERE NO `release: published` TRIGGER HERE. Because it cannot work,
# and it fails in the most expensive way available: after the twenty-minute
# build, at the deploy.
#
# A release event carries the TAG as its ref. The `github-pages` environment,
# which the publish job below must name because that is how deploy-pages works,
# is restricted to deployments from the branch `main` -- GitHub creates that
# restriction itself when a repository's Pages source is set to Actions. A run
# whose ref is refs/tags/vN.N.N is refused by that policy, so the build job
# would fetch emscripten, compile the twin, download the release assets, render
# the site, and only then be told the ref may not deploy.
#
# Loosening the environment to allow tags would be the wrong repair anyway. The
# site is built from main's prose, not from the tag's, and a tag is a snapshot
# of firmware rather than of the site.
#
# The release workflow therefore DISPATCHES this one against main once the
# release exists and its assets are attached -- see `rebuild the site` in
# release.yml. The automatic GITHUB_TOKEN can do that: workflow_dispatch is one
# of the two events documented as always creating a run, precisely so a workflow
# can hand off to another. A dispatched run's ref is main, which the environment
# allows, and the build reads "the latest release" and finds the one just
# published.
#
# Manual dispatch stays for prose, and is the same entry point.
#
# Add `on: push: branches: [main]` later if the manual step becomes tedious.
# That is a deliberate change, not a default.
name: pages

on:
  workflow_dispatch:

# Read-only by default; the publish job raises its own scope and nothing else
# gets write access to anything.
permissions:
  contents: read

# One site build at a time, and never cancel a deployment midway: a half-
# deployed site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here talks to git after the checkout.
          persist-credentials: false

      # The twin is a WASM build of the real modules/ultrawidelock_uwb sources.
      # web/build.py checks for emcc on PATH and, when it is absent, publishes
      # the twin page with an explanation instead of a simulator -- so a failure
      # here degrades the site rather than breaking it.
      #
      # Cloned from emscripten-core at a pinned tag rather than through a
      # third-party setup action, because an action that installs a toolchain is
      # an unpinned dependency wearing a pin. 6.0.6 is the version the twin is
      # developed against locally; bump it deliberately.
      - name: emscripten
        env:
          EMSDK_VERSION: "6.0.6"
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" \
            https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
          # build.py looks for emcc on PATH before it calls build-wasm.sh, so
          # exporting it into the environment of later steps is what makes the
          # twin build at all. (build-wasm.sh would source emsdk_env.sh itself,
          # but it never gets the chance.)
          . "$HOME/emsdk/emsdk_env.sh"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"

      # The flasher offers three merged ESP32 images. They are gitignored --
      # 6 MB of build output does not belong in the tree -- so the published
      # page gets them from the latest release instead.
      #
      # Staged into build/esp32-matter-lock-<chip>/, because that is where
      # web/build.py's stage_firmware() looks; it then copies them into
      # web/dist/flash/ and checks them against the flasher's manifest.
      #
      # No release yet, or a release missing an image, is a normal state and not
      # a failure: build.py marks the flasher page as carrying no firmware, and
      # says which images were absent. That is the correct thing for the site to
      # say, and it is how the page looks until the first release exists.
      - name: firmware from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::no release published yet -- the flasher page will say it carries no images"
            exit 0
          fi

          # ASK WHAT THE RELEASE ACTUALLY HAS, then insist on getting it.
          # `gh release download` exits 1 both for an asset that is not there
          # and for one that is there and would not come down, and those are
          # opposite facts: the first is a release that shipped no ESP32 images
          # and the page should say so, the second is a transport failure that
          # would publish a site whose flash buttons are gone. Listing first is
          # what separates them.
          assets="$(gh release view --repo "$REPO" --json assets \
                      --jq '.assets[].name')"

          for chip in esp32s3 esp32c5 esp32c6; do
            name="ultrawidelock-matter-lock-$chip.bin"
            mkdir -p "build/esp32-matter-lock-$chip"
            if ! grep -qx "$name" <<<"$assets"; then
              echo "::notice::$name is not among the latest release's assets"
              continue
            fi
            if ! gh release download --repo "$REPO" --pattern "$name" \
                   --dir "build/esp32-matter-lock-$chip" --clobber; then
              echo "::error::$name is listed on the latest release but would not download. Publishing now would put up a flasher page with no images on it and no sign that anything went wrong. Re-run this workflow."
              exit 1
            fi
          done

      # The over-the-air updates and the index the FOTA panel looks a board up
      # in. Same shape as the step above and for the same reason: they are
      # release artifacts, not build output, and nothing in the tree carries
      # them.
      #
      # Staged into build/release/ota/, where web/build.py's stage_ota() looks.
      # ota-index.json is the one file that must arrive: without it the panel
      # fetches, gets a 404 and says no updates are published -- which is the
      # honest state of a site whose release carried none, and is why nothing
      # here is allowed to fail the build.
      #
      # The whole directory travels as one asset. The fan is one delta per
      # release still in the field, so the file COUNT grows with every release
      # while the bytes stay tiny (~11 KB each); downloading them one pattern at
      # a time would mean this step needed editing every time a release shipped.
      - name: over-the-air updates from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::no release published yet -- the FOTA panel will say so"
            exit 0
          fi
          mkdir -p build/release

          # Listed first, for the reason given in the step above: an absent
          # asset and a failed download are opposite facts that this command
          # reports with the same exit status, and only one of them should
          # reach the published page.
          if ! gh release view --repo "$REPO" --json assets --jq '.assets[].name' \
                 | grep -qx 'ultrawidelock-ota.zip'; then
            echo "::notice::this release carries no over-the-air updates"
          else
            if ! gh release download --repo "$REPO" --pattern 'ultrawidelock-ota.zip' \
                   --dir build/release --clobber; then
              echo "::error::ultrawidelock-ota.zip is listed on the latest release but would not download. Publishing now would tell every board in the field that no update applies, and say nothing about why. Re-run this workflow."
              exit 1
            fi
            # A zip that arrived and will not open is a corrupt or truncated
            # asset, never a normal state, and it fails identically on the page.
            if ! unzip -q -o build/release/ultrawidelock-ota.zip -d build/release; then
              echo "::error::ultrawidelock-ota.zip downloaded but will not unzip -- the published asset is corrupt. The FOTA panel would say no updates are published, which is wrong rather than merely empty."
              exit 1
            fi
            rm -f build/release/ultrawidelock-ota.zip
            echo "staged $(find build/release/ota -type f | wc -l) over-the-air file(s)"
            # An asset that arrived but carries no index is NOT the same as a
            # release that shipped no updates, and both look identical on the
            # published page: it fetches, 404s, and says none are published. A
            # warning rather than a failure, per the note above -- but silence
            # here would hide a malformed asset behind an honest-looking page.
            [ -f build/release/ota/ota-index.json ] || \
              echo "::warning::ultrawidelock-ota.zip has no ota/ota-index.json -- the FOTA panel will say no updates are published, which is wrong rather than merely empty"
          fi

      # The 3D graph's data is committed (web/graph/files.json); its renderer is
      # not -- 1.3 MB of three.js is a third-party bundle and stays out of the
      # tree. Fetching it here is what makes the published graph the flyable one
      # rather than the flat SVG fallback, which is what this site shipped for
      # as long as CI had neither half.
      #
      # `make docs-graph3d` is the same target a contributor runs locally, so
      # the URL and the pin live in one place. curl -f means a bad fetch fails
      # this step instead of quietly publishing the flat page again.
      - name: 3D graph renderer
        run: make docs-graph3d

      # --check fails the build on a dead internal link. Same gate as
      # `make docs-check`, which is what runs locally.
      - name: render the site
        run: python3 web/build.py --check

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploying needs no write access to the repository at all: pages:write
    # publishes the artifact that build produced, id-token:write proves to Pages
    # which workflow built it. Nothing in this job can touch a branch or a tag.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
