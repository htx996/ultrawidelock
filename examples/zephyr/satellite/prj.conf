# Satellite responder: CRED-tier CCC engine, keys injected over the shell.
# The UWB and PSA halves mirror the proven configs: the tier block is the
# lock's (apps/dwm3001cdk-lock), the PSA block is examples/zephyr/nrf5340dk-initiator's
# trimmed to the one primitive the CCC key ladder uses (AES-ECB).
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_STDOUT_CONSOLE=y

# The M1-M4 codec and the cherry shim allocate via qmalloc -> k_malloc.
CONFIG_HEAP_MEM_POOL_SIZE=8192

# --- UWB: the full responder tier --------------------------------------------
# Unlike the initiator example, this board wants exactly the lock's role: the
# whole CCC/credential session engine (ccc_shim_rx and friends). The keys come
# from `sat join` instead of BLE, through the same ultrawidelock_uwb_start_cred()
# entry the credential M4 uses.
CONFIG_ULTRAWIDELOCK_UWB=y
CONFIG_ULTRAWIDELOCK_UWB_RESPONDER=y
CONFIG_ULTRAWIDELOCK_CRED=y

# Stage B re-run: this build is responder 1 of a 2-responder round, answering
# Response_1 in slot 3. The first attempt concluded the phone would not report a
# second responder, but that run was made with a 64-byte SP0 stash against a
# 65-byte two-record Final_Data, so any block where the phone DID report both
# was discarded before the decode. Both values must match the lock image or the
# RangingConfiguration SaltedHash diverges and nothing decodes.
CONFIG_ULTRAWIDELOCK_NUM_RESPONDERS=2
CONFIG_ULTRAWIDELOCK_RESPONDER_INDEX=1

# Mandatory here, not optional: on a silent block this anchor has no Response TX
# timestamp for the round, and the live-recompute path (the dual-core nRF5340
# default) would pair a stale t3 with this round's t2/t6 and latch a garbage
# distance, resetting the layer-4 trust run every second block. The snapshot
# path is consume-once and fails closed instead, which is exactly what
# alternation needs — and is the path the lock has always run.
CONFIG_ULTRAWIDELOCK_UWB_FINAL_SNAPSHOT=y

# The `ultrawidelock` console drives the driver, which is not brought up until the
# first `sat join`; keep it out the way the CDK does.
CONFIG_ULTRAWIDELOCK_UWB_SHELL=n

# DW3110 on the DWM3000EVB is the DW3000 branch; same lines and reasons as
# examples/zephyr/nrf5340dk-initiator/prj.conf:45-59.
CONFIG_DW3000=y
CONFIG_DW3000_CHIP_DW3000=y
CONFIG_SPI_ASYNC=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

# Key injection happens on the UART shell (DK VCOM): paste the SAT-HANDOFF
# line the lock prints. First light stays on this wire so radio coexistence
# cannot masquerade as protocol failure (docs/second-anchor.md, risks).
CONFIG_SHELL=y

# --- PSA crypto ---------------------------------------------------------------
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# PSA working buffers come from the mbedTLS heap; without it psa_import_key
# fails with -141 (PSA_ERROR_INSUFFICIENT_MEMORY).
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384

# The CCC key schedule (ccc_kdf.c) is built entirely on one AES-ECB block
# encrypt, reached through ccc_crypto_psa.c. Without ECB_NO_PADDING it fails
# at RUNTIME with NOT_SUPPORTED, not at build (initiator prj.conf:126-132).
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
