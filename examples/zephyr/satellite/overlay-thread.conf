# Thread on the satellite, so its ranges can reach the lock over the sealed
# link. OPT-IN, via `make sat-build SAT_THREAD=1`, and deliberately so: the
# ranging arm margin measured without it is the number this config has to be
# judged against, and that comparison is impossible if there is only one build.
#
# STANDALONE OpenThread, mirroring apps/dwm3001cdk-lock/overlay-thread.conf: no
# NET_L2_OPENTHREAD, so no NETWORKING, no NET_IPV6, no NET_UDP and no
# NET_SOCKETS. witness_link.c already talks to otUdpOpen/otUdpBind directly, so
# the L2 would be carrying a Zephyr socket API nothing on this path uses.
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MANUAL_START=y

# MED, not SED. CONFIG_OPENTHREAD_MTD_SED is deliberately NOT set.
#
# CORRECTED 2026-08-21: an earlier version of this comment argued a 500 ms poll
# period would land every report three blocks late. That is wrong, and the
# reasoning was borrowed from the retired BLE witness anyway. A sleepy child's
# poll period gates DOWNLINK -- when it collects what its parent is holding for
# it -- and a sleepy child transmits uplink whenever it likes. Reports would not
# have been delayed by it at all.
#
# MED is still the right choice, for the smaller reason: anything the LOCK ever
# needs to send this board -- a challenge, a rekey, the session handoff once it
# moves off the UART -- waits a poll period on an SED. This board is
# mains-powered and has no BLE duty to schedule around, so there is nothing to
# buy with the sleep.

# The nRF5340's 802.15.4 radio lives on the NETWORK core, unlike the
# DWM3001CDK's nRF52833 where it is on-core. The app core reaches it through
# the serialisation host; the net-core image itself is selected in
# sysbuild-thread.conf.
CONFIG_NRF_802154_SER_HOST=y

# OpenThread's own thread plus the workqueue it defers onto. Same sizes the
# lock runs, which is the only place these have been exercised.
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192

# The shell STAYS. Unlike the lock, this board still needs `sat join` to receive
# its session keys, and until the handoff itself moves onto the sealed link a
# console is the only way they arrive.
#
# ON RTT, NOT THE UART, chosen 2026-08-21 for a reason that turned out NOT to be
# the one first written here.
#
# What is true: RTT has been reliable on this board throughout, and it is the
# transport that can still print a fault dump when the shell thread dies. Two
# real defects found that day -- an OpenThread mutex deadlock and a shell stack
# overflow -- both present as "the console stopped answering", and on the UART
# backend the Zephyr fatal-error dump goes to a console that is no longer
# running. Moving the shell here is what made them legible.
#
# WHAT IS NOT TRUE, corrected the same day: an earlier version of this comment
# blamed hardware flow control, claiming the DK's VCOM would not hold CTS
# asserted. Flow control is OFF on this board, both ends. The board DTS sets no
# `hw-flow-control` on &uart0, so the driver runs NRF_UARTE_HWFC_DISABLED and
# the UARTE ignores CTS entirely; all pinctrl leaves behind is RTS on P0.19
# driven high once at init, which is harmless. Board TX was never gated. The
# story survived for hours only because nobody grepped the DTS for the property
# that would have enabled it.
#
# Logs ride the shell backend so one stream carries both; CONFIG_LOG_BACKEND_RTT
# would otherwise fight the shell for the same channel.
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_RTT=n
# The default 10 ms poll is what makes an RTT shell feel like a dead one.
CONFIG_SHELL_RTT_RX_POLL_PERIOD=10
# The down-buffer defaults to 16 bytes and RTT DROPS what does not fit rather
# than blocking, so a long line arrives as its first few characters and the
# shell reports a parameter-count error against a command nobody typed. A
# dataset command is 226 characters; this holds one with room to spare.
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=512

# `sat dataset` overflows the default 2 KB shell stack and takes the board down
# with "ZEPHYR FATAL ERROR 2: Stack overflow ... Current thread: shell_rtt".
# It is a stack-hungry command by nature: a 254-byte buffer in the handler, a
# ~255-byte otOperationalDatasetTlvs below it, and then the whole OpenThread
# start path on top of both. Worth knowing that on the UART backend the same
# crash was invisible -- the fault dump goes to a console that could not
# transmit -- so it read as a hung shell for hours.
CONFIG_SHELL_STACK_SIZE=8192
