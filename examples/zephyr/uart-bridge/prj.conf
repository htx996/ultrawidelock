# The second dongle stands in for the USB-to-serial adapter nobody owns.
#
# No radio, no MPSL, no crypto: this image is the plain USB CDC stack Nordic
# ships plus a byte pump, so its USB works the way every stock dongle's does.
# Both banners off so the bridge adds nothing of its own to the stream it
# carries.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_GPIO=y

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_LOG=n
