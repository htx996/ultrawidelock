# DIAGNOSTIC ONLY -- pulls openthread off a shared init priority so a boot
# trace can name it.
#
# usbd_core, net_core and openthread all register at POST_KERNEL priority 90 in
# the stock configuration, so they land in one indivisible block: a SYS_INIT
# mark cannot be placed between entries that share a priority, and within a
# priority the order is link order. MEASURED 2026-08-20, the witness boot dies
# somewhere inside that block.
#
# Only one of the three can be moved. NET_INIT_PRIO and USBD_THREAD_INIT_PRIO
# are `int` with no prompt, so Kconfig refuses to take a value for them from a
# configuration file; OPENTHREAD_SYS_INIT_PRIORITY has a prompt. That is enough
# for the split that matters, because openthread is the entry that brings up
# the 802.15.4 radio and the other two do not touch a radio at all.
#
# Relative order is preserved: usbd and net at 90, then openthread, then the
# 802.15.4 temperature hook, which is moved only so the openthread move does
# not overtake it.

CONFIG_OPENTHREAD_SYS_INIT_PRIORITY=94
# Mark at 95.
# Default 91, which would now run BEFORE openthread rather than after it. Moved
# to keep the order it already had. The driver's own BUILD_ASSERT needs
# CONFIG_SENSOR_INIT_PRIORITY (90) to stay below this.
CONFIG_NRF_802154_TEMPERATURE_UPDATE_INIT_PRIO=96
# Mark at 97.
