# THE BOOT FAULT. MEASURED 2026-08-20 via the flash crash record: the boot
# dies in nrfx_nvmc_page_erase (PC 0x1a982, NVMC->ERASEPAGE), called from the
# flash driver inside an MPSL timeslot on the idle thread. Partition Manager
# had placed settings_storage at 0xFE000 -- the Nordic USB bootloader's MBR
# params page, which the bootloader ACL-protects at every boot. First NVS
# mount reads that page, sees data that is not NVS, and tries to erase it;
# the ACL turns the erase into the precise bus fault that ate three weeks.
# Had the erase gone through, it would have destroyed the DFU bootloader
# instead.
#
# Partition Manager is deprecated here anyway (the build says so) and it is
# the only thing that does not know this board has a bootloader at 0xE0000.
# With it off, the board devicetree rules, and Zephyr's dts for this dongle
# already places storage at 0xDC000, below the bootloader, for exactly this
# reason.
SB_CONFIG_PARTITION_MANAGER=n
