# DIAGNOSTIC ONLY -- moves OpenThread's start-up out of SYS_INIT so that a
# failure inside it can be read as text instead of counted as LED blinks.
#
# MEASURED 2026-08-20: the boot stops inside openthread_sys_init, which is
# openthread_init() -> otSysInit() -> platformRadioInit() -> nrf_802154_init().
# Everything after that point in POST_KERNEL never runs, and main() is never
# reached, so the USB CDC console is never opened and the image has no way to
# say what went wrong.
#
# usbd_core and net_core both complete before it, so the console CAN exist at
# that stage -- it just is not open yet, because opening it is main()'s job.
# Turning OPENTHREAD_SYS_INIT off lets main() reach the console first and call
# openthread_init() afterwards, with the log running.
#
# GETTING THE LINE OUT WITHOUT IMMEDIATE MODE. The first version of this file
# set CONFIG_LOG_MODE_IMMEDIATE=y and CONFIG_LOG_DEFAULT_LEVEL=4, reasoning that
# deferred logging hands messages to a thread that will not run once the calling
# thread is stuck. MEASURED 2026-08-20: that image went dark before P_51, which
# is earlier than any previous failure, so immediate mode was making debug lines
# from POST_KERNEL drivers go straight at a USB CDC console that does not exist
# until P_90. The instrument was breaking the boot it was measuring.
#
# CONFIG_LOG_PRINTK=n gets the same guarantee more cheaply: it takes printk out
# of the logging subsystem entirely and writes it straight to the console, so
# the two diagnostic lines in main() do not sit in a buffer waiting for a thread
# that will never run. Logging itself stays deferred and quiet.
#
# ASSERT on so that __ASSERT_NO_MSG(device_is_ready(radio_dev)) and OpenThread's
# instance assert say something instead of falling through silently.
#
# NOT FOR ANY SHIPPING IMAGE.

# RESTORED 2026-08-20: with this off, nrf_802154_init() never runs, and the
# panic MEASURED on generation 12 is nrf_802154_assert_handler -- which is
# exactly what an uninitialised radio driver being poked would look like.
# Testing whether the assert was self-inflicted by this overlay.
CONFIG_OPENTHREAD_SYS_INIT=y
CONFIG_LOG_PRINTK=n
CONFIG_ASSERT=y

# The banners are the printks that run before USB is enabled, and with
# LOG_PRINTK=n they go straight at a CDC ACM console that does not exist yet:
# cdc_acm_serial only enables it at APPLICATION P_90, and both banners register
# at APPLICATION P_0. MEASURED 2026-08-20, that stalls the boot one entry past
# the last trace mark.
#
# TWO symbols, not one. CONFIG_BOOT_BANNER=n only empties Zephyr's boot_banner()
# -- verified by disassembly, it becomes a bare `bx lr`. NCS registers a second,
# independent SYS_INIT at the same level (nrf/lib/boot_banner/banner.c:59) that
# printks three more lines, and it stays on when the Zephyr one goes off. The
# first attempt at this fix turned off only the Zephyr symbol and the boot died
# in exactly the same place; the init table in the ELF named the survivor.
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# MEASURED 2026-08-20: the boot stops in udc_nrf.c:751, a bare unbounded spin
# waiting for USBD->EVENTCAUSE.READY after the peripheral is enabled, reached
# from cdc_acm_serial_init_device -> usbd_enable(). The USB peripheral never
# reports ready.
#
# The suspicion is MPSL. CONFIG_CLOCK_CONTROL_NRF_FORCE_ALT=y hands clock and
# POWER management to MPSL, and nRF52840's USBD needs HFXO plus the USB power
# events. Nothing in this project has ever run USB and MPSL together: the lock's
# reader image has a console with its radios DOWN, and its Thread image has the
# radios up and never opens the console. The dongle is the first image asked to
# do both at once.
#
# MEASURED with CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n: the boot stops in the
# SAME place. nrf_usbd_legacy_enable, and the spin inside it, is reachable only
# from udc_nrf_enable, so usbd_enable() is not what blocks. What is left is
# usbd_init() -> udc_nrf_init(), which takes the HFXO onoff manager, calls
# nrfx_power_init and then nrfx_power_usbevt_enable. That is the POWER and CLOCK
# peripheral MPSL owns, and with the dongle plugged in the USB event fires the
# instant it is enabled, handing control to a cooperative USB thread that
# outranks main and need never give it back.
#
# So MERELY INITIALISING USB is enough. Taking the class out of the boot
# entirely is the test that separates "USB is the whole problem" from "something
# else is wrong as well": nothing USB then runs before main.
#
# RESTORED 2026-08-20: USB was innocent, like every other suspect. The fault
# was NVS erasing the DFU bootloader's ACL-protected MBR params page, where
# Partition Manager had put settings_storage (see sysbuild.conf); with that
# fixed, the boot completed with USB out and there is no console without it.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# MEASURED 2026-08-20 (generation 6): with CONFIG_BT=y and USB out of the boot,
# the trace stops at bt_tx_processor_init -- the one initialiser sitting between
# mark_past_post_kernel and mark_application. It starts a COOPERATIVE work queue
# thread at priority -1 on a 768-byte stack (nrf/Kconfig.nrf applies that as the
# nRF52840 configdefault; upstream Zephyr's own default is 1024, and its help
# text says to raise it on overflow). Raised here to test the overflow theory;
# the cost is 1,280 bytes of RAM in a build using 37% of 256 KB.
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=2048
