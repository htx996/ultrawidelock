# The nRF52833 lock has no CryptoCell, which is why the lock never sees this.
#
# Pair this file with its devicetree half or the entropy device dangles:
#
#   make witness-build TRACE=1 \
#     WITNESS_CONF="overlay-otmain.conf;overlay-nobt.conf;overlay-nocc3xx.conf" \
#     WITNESS_DTC="overlay-nocc3xx.overlay"
#
# Nothing here needs the accelerator. CONFIG_PSA_CRYPTO_DRIVER_OBERON=y on both
# boards, so CMAC and CCM are software either way; CC310 was being brought up
# as an entropy source and an accelerator this firmware never asks for.
#
# If the trace advances past green with this file, that is the answer and it
# becomes a permanent line in prj.conf with the measurement beside it.
