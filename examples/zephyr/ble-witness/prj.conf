# BLE witness: passive scanner + Thread reporter. Holds no unlock authority.
#
# One image for every mounting position. Role, keys and the Thread dataset are
# provisioned once over USB CDC and persist in settings; steady state needs no
# host, no probe and no per-session commands.

# ---- BLE: observer only ---------------------------------------------------
# Passive scanning is the whole BLE job. No connections, no advertising: this
# board never talks to a phone, it only overhears one.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_BROADCASTER=n
CONFIG_BT_DEVICE_NAME="ultrawidelock-witness"

# ---- Thread: standalone OpenThread, SED -----------------------------------
# STANDALONE, not NET_L2_OPENTHREAD, mirroring the lock: every datagram goes
# through otUdpSend and an otUdpSocket callback, so the whole IPv6 stack would
# be linked to serve nobody. Nordic's radio driver is selected by
# nrf/modules/openthread/platform/CMakeLists.txt precisely when the L2 is off.
CONFIG_NETWORKING=y
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y

# SED, and this is the opposite of the lock's choice for a reason. The lock is
# MED because it must hear a hub promptly. This board's only downlink is the
# challenge nonce, which may wait; what it cannot afford is 802.15.4 holding
# the receiver on while BLE is trying to scan. A sleepy child gives the radio
# back between polls, and the scan duty cycle is the whole product here.
#
# Mains-powered regardless: the choice is radio time, not battery.
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_POLL_PERIOD=500

# The dataset arrives at provisioning, not at boot. A stack that starts without
# credentials scans and retries forever on a radio BLE is sharing.
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_SLAAC=n
CONFIG_OPENTHREAD_SRP_CLIENT=n

# ---- crypto ---------------------------------------------------------------
# CMAC labels each advertiser under the witness group key; CCM seals each
# report under this witness's link key. One backend for both.
CONFIG_NRF_SECURITY=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_ENTROPY_GENERATOR=y

# ---- storage --------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- console --------------------------------------------------------------
# Provisioning only. Lines are assembled in the UART IRQ and drained by the
# main loop, so an absent host never blocks the reporting cadence.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# The shared window accumulator and wire codec. NOT the inside latch: the veto
# is the lock's decision and no part of it belongs on a witness.
CONFIG_ULTRAWIDELOCK_ANCHOR=y
CONFIG_ULTRAWIDELOCK_WITNESS_CODEC=y
