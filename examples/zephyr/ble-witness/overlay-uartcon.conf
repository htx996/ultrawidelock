# DIAGNOSTIC, paired with overlay-uartcon.overlay. The full fault dump, on
# copper.
#
# The LED has said all it can: reason 25, PRECISE, BFAR outside every region
# the image names in a literal -- not a peripheral, not RAM, not flash, not
# the CryptoCell (2026-08-20, removed entirely and the fault survived), not
# address zero. A BFAR nobody names is a BFAR somebody computed: a corrupted
# pointer or a corrupted context. The next question is WHICH THREAD and WHICH
# PC, and that answer does not fit in six lamp states. It fits in the fault
# dump Zephyr already prints -- BFAR, PC, LR, xPSR, thread name -- which has
# been going to a USB CDC console that dies with the boot.
#
# This build moves the console to uart0, the pads. Immediate mode is safe
# HERE and only here: the a9a2c9d4-era measurement that immediate logging
# breaks the boot was immediate logging aimed at a CDC console that does not
# exist until APPLICATION P_90; uart0 is real hardware, ready at PRE_KERNEL_1.
# Deferred mode would be useless for the same reason it always was: the dump
# would sit in a buffer owned by a thread that will never run again.
#
# THREAD_NAME so the dump says which thread died, not which pointer.
#
# The provisioning console moves to the pads with this file. BENCH ONLY.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_THREAD_NAME=y
