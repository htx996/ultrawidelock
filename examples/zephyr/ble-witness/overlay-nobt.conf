# DIAGNOSTIC. Thread without Bluetooth, to answer the P0 question.
#
# The image hangs in POST_KERNEL priority 1..44 on the dongle. With the
# CryptoCell taken out (overlay-nocc3xx.conf) it still hangs, which leaves
# log_core, malloc, hci_driver and mpsl_init. hci_driver is the SoftDevice
# Controller and mpsl_init is the layer that arbitrates the radio between it
# and 802.15.4 -- so the question is whether the two radios can share this
# part at all, which is stage P0 in docs/inside-latch.md.
#
# This build cannot witness anything: no scanning, no reports. The only output
# is the boot-trace colour. If it advances past green, Bluetooth is what the
# boot cannot survive alongside Thread, and the two-radio witness needs
# rethinking before any more bench time goes into it.
CONFIG_BT=n
CONFIG_BT_OBSERVER=n
