# DIAGNOSTIC. Neither radio brought up, to find out whether this board can
# complete its own boot at all.
#
# MEASURED 2026-08-20: with Bluetooth out and OpenThread's SYS_INIT in, the
# board takes a PRECISE data bus fault (reason 25) before POST_KERNEL P_93.
# Roughly twenty flash cycles have gone into locating it by LED, and every
# structural theory so far -- USB, the BT tx processor, the BT host asserting --
# was withdrawn. This overlay stops theorising and asks the one question that
# was never asked directly:
#
#   with NO radio activity at all, does the image reach main()?
#
# yes  -> the fault belongs to radio bring-up, and the search has a shape
# no   -> the fault is in the base image and every radio theory was wasted
#
# This build cannot witness anything. Its only output is the boot trace.
CONFIG_OPENTHREAD_SYS_INIT=n

# With the SYS_INIT off nothing runs nrf_802154_init, but the driver's
# temperature updater still registers at POST_KERNEL 91 and pokes the
# uninitialised driver, which panics in nrf_802154_assert_handler. That panic
# is this overlay's own artifact; without this line the control answers the
# wrong question.
CONFIG_NRF_802154_TEMPERATURE_UPDATE=n
