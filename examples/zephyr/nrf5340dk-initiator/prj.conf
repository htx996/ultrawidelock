# nRF5340 DK, app core: credential initiator (User-Device role).
#
# Two halves. The BLE half is the central mirror of the reader's peripheral
# config in apps/dwm3001cdk-lock/prj.conf, and the buffer sizing below is copied from it
# deliberately so an SDU that fits one fits the other. The PSA half is the same
# block on_target_ec/prj.conf proved against the real CryptoCell backend.
CONFIG_MAIN_STACK_SIZE=16384

# The Access Protocol does not run on main. L2CAP CoC reassembly lands on the
# system workqueue, so on_data() and everything under ultrawidelock_device_on_command()
# -- P-256 ECDH through PSA -- execute on this stack, and Zephyr's 1024 B default
# overflows the first time AUTH0 arrives (USAGE FAULT at ultrawidelock_device.c:298).
# apps/dwm3001cdk-lock/prj.conf:325 gives the reader 4096 for the same crypto; this side adds
# 644 B of response buffers on top (resp[320] + frame[4+320] in on_data), so it
# gets the next size up rather than the reader's exact figure.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_STDOUT_CONSOLE=y

# The M2/M4 builder allocates each message (ultrawidelock_uwb_msg_builder.c: qmalloc ->
# k_malloc). Messages are tens of bytes and are freed as soon as they are sealed.
#
# This is a no-op today and deliberately kept: the board already contributes
# CONFIG_HEAP_MEM_POOL_ADD_SIZE_BOARD=4096, so the pool was this size before the
# line existed and the measured RAM cost of adding it was 7 bytes. It is here so
# the requirement is stated by the application that has it. A k_malloc against a
# zero-sized pool returns NULL with no build-time warning, and inheriting that
# size from a board default is not something to discover on hardware.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# --- UWB radio ---------------------------------------------------------------
# ULTRAWIDELOCK_UWB alone is a complete tier: it compiles uwb_min.c and nothing else, which
# is the DW3110 bring-up driver plus a raw static-STS SS-TWR initiator burst. It
# selects SPI and GPIO for us and puts modules/ultrawidelock_uwb/src/driver and
# modules/ultrawidelock_port/include on the include path.
#
# Deliberately NOT ULTRAWIDELOCK_UWB_RESPONDER, which is the lock's role and pulls in the
# whole CCC/credential session engine. This board needs the initiator role, and that
# role does not exist yet (Kconfig has no symbol for it).
#
# Needs -DZEPHYR_EXTRA_MODULES with modules/ultrawidelock_uwb and modules/ultrawidelock_dw3000, and a
# PRISTINE build directory so boards/*.overlay is discovered. `make nrf-init-build`
# does both.
CONFIG_ULTRAWIDELOCK_UWB=y

# uwb_min.c is written against the Decawave driver (deca_device_api.h,
# dw3000_hw.h), and modules/ultrawidelock_dw3000 contributes nothing at all -- not even its
# include paths -- unless CONFIG_DW3000 is set: its whole CMakeLists is wrapped
# in if(CONFIG_DW3000). Putting the module on ZEPHYR_EXTRA_MODULES is necessary
# and not sufficient, and the failure is a missing header rather than anything
# that names the option. The chip choice mirrors apps/dwm3001cdk-lock/prj.conf:213-214; the
# DWM3000EVB carries a DW3110, which is the DW3000 branch.
CONFIG_DW3000=y
CONFIG_DW3000_CHIP_DW3000=y

# ports/zephyr/dw3000/dw3000_spi.c:127 calls spi_transceive_signal, which is the
# ASYNC SPI API and compiles to nothing without this -- the failure is a link
# error naming the symbol, with no hint that a Kconfig is missing.
# apps/dwm3001cdk-lock/prj.conf:210-212 carries the same line and the same explanation.
CONFIG_SPI_ASYNC=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

# --- BLE: central + observer, the two roles the reader does not have ---------
# BT_OBSERVER is what lets us scan for the reader's 0xFFF2 advert; BT_CENTRAL is
# what lets us connect to it. Both are n in apps/dwm3001cdk-lock/prj.conf, which is the whole
# reason this app cannot simply be a build flag on the reader.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_BROADCASTER=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_DEVICE_NAME="ultrawidelock-initiator"

# GATT client: discover the service, discover the two characteristics, READ the
# reader's SPSM/version list, WRITE the version we select.
CONFIG_BT_GATT_CLIENT=y

# The credential data path is an L2CAP connection-oriented channel on the SPSM the
# READ returns. 512 matches ULTRAWIDELOCK_L2CAP_MTU in the backend and the reader's own
# CONFIG_BT_L2CAP_TX_MTU; the ACL sizes below leave the controller segmenting,
# which is what the reader already does over the air.
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_TX_MTU=512
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251

# SMP is not wanted for itself — nothing here pairs — but BT_L2CAP_DYNAMIC_CHANNEL
# `depends on BT_SMP` (zephyr/subsys/bluetooth/host/Kconfig.l2cap:49), so turning
# it off silently drops the CoC support with no warning and the link fails on
# bt_l2cap_chan_connect. The reader carries it for the same reason
# (apps/dwm3001cdk-lock/prj.conf:29). Bonding and signing stay off, which is the part that
# actually matters.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=n
CONFIG_BT_SIGNING=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_EATT=n

# --- PSA crypto ---------------------------------------------------------------
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# PSA working buffers come from the mbedTLS heap. Without it psa_import_key,
# AES-GCM and P-256 all fail with -141 (PSA_ERROR_INSUFFICIENT_MEMORY).
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768

# The exact primitives ultrawidelock_prim_psa.c calls.
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# The CCC key schedule reaches AES-ECB through the shared primitive provider.
# Without this the adapter and provider still
# compiles and links -- PSA_ALG_ECB_NO_PADDING is always declared -- and
# psa_cipher_encrypt fails at RUNTIME with NOT_SUPPORTED, which surfaces as a
# Pre-POLL the reader silently drops on a MIC check. Nothing names the missing
# option.
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
